                  raise SystemExit('v110.code_manifest_unbound')
              raw = read_regular(MANIFEST, 256 * 1024)
              if hashlib.sha256(raw).hexdigest() != expected:
                  raise SystemExit('v110.code_manifest_digest')
              try:
                  manifest = json.loads(raw, object_pairs_hook=strict_object, parse_constant=strict_object)
              except (ValueError, UnicodeError):
                  raise SystemExit('v110.code_manifest_json')
              if (type(manifest) is not dict or set(manifest) != {'schema', 'codeFiles'} or
                      manifest['schema'] != 'openclaw.v110.code-manifest.v1' or
                      type(manifest['codeFiles']) is not dict or not 1 <= len(manifest['codeFiles']) <= 256 or
                      ENTRY not in manifest['codeFiles'] or IMPORTS not in manifest['codeFiles']):
                  raise SystemExit('v110.code_manifest_schema')
              captured, total = {}, 0
              for relative, pin in manifest['codeFiles'].items():
                  if relative in (MANIFEST, WORKFLOW):
                      raise SystemExit('v110.code_manifest_self_or_workflow')
                  if (type(pin) is not dict or set(pin) != {'sha256', 'bytes'} or
                          type(pin['sha256']) is not str or re.fullmatch(r'[0-9a-f]{64}', pin['sha256']) is None or
                          type(pin['bytes']) is not int or not 1 <= pin['bytes'] <= MAXIMUM):
                      raise SystemExit('v110.code_manifest_pin')
                  total += pin['bytes']
                  if total > MAXIMUM:
                      raise SystemExit('v110.code_manifest_total_size')
                  content = read_regular(relative, pin['bytes'])
                  if len(content) != pin['bytes'] or hashlib.sha256(content).hexdigest() != pin['sha256']:
                      raise SystemExit('v110.code_manifest_content')
                  if relative == ENTRY:
                      if pin['sha256'] != entry_sha:
                          raise SystemExit('v110.code_manifest_entry_digest')
                  captured[relative] = content
              return captured

          captured = verify_code_manifest()
          imports_path = ROOT / IMPORTS
          imports_namespace = {'__name__': '_v110_verified_imports', '__file__': str(imports_path)}
          exec(compile(captured[IMPORTS], str(imports_path), 'exec'), imports_namespace)
          closed_builtins = imports_namespace['install_verified_imports'](str(ROOT), captured)
          entry_path = ROOT / ENTRY
          sys.argv = [str(entry_path), *sys.argv[1:]]
          exec(compile(captured[ENTRY], str(entry_path), 'exec'),
              {'__name__': '__main__', '__file__': str(entry_path), '__package__': None,
                  '__builtins__': closed_builtins})
          PY
  final:
    if: always()
    needs: [admission, source]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      V110_ADMISSION_RESULT: ${{ needs.admission.result }}
      V110_SOURCE_RESULT: ${{ needs.source.result }}
      V110_ADMISSION_REQUEST_SHA256: ${{ needs.admission.outputs.request_sha }}
      V110_ADMISSION_PIPELINE_HEAD: ${{ needs.admission.outputs.pipeline_head }}
      V110_ADMISSION_SOURCE_SHA: ${{ needs.admission.outputs.source_sha }}
      V110_ADMISSION_RUN_ID: ${{ needs.admission.outputs.run_id }}
    steps:
      - name: Start shared deadline before checkout
        env:
          V110_JOB_MINUTES: 10
        run: |
          python3 -I - <<'PY'
          from datetime import datetime, timezone
          import os, re, time

          def utc(value):
              if not isinstance(value, str) or len(value) != 20 or not value.endswith('Z'):
                  raise SystemExit('v110.disarmed_or_invalid_clock')
              try:
                  return int(datetime.strptime(value, '%Y-%m-%dT%H:%M:%SZ').replace(tzinfo=timezone.utc).timestamp())
              except ValueError:
                  raise SystemExit('v110.disarmed_or_invalid_clock')

          pr = os.environ.get('V110_BOUND_PR', '')
          source = os.environ.get('V110_SOURCE_SHA', '')
          entry = os.environ.get('V110_ENTRY_SHA256', '')
          code_manifest = os.environ.get('V110_CODE_MANIFEST_SHA256', '')
          if (os.environ.get('V110_ARMED') != 'true' or
                  re.fullmatch(r'[1-9][0-9]{0,9}', pr) is None or
                  re.fullmatch(r'[0-9a-f]{40}', source) is None or source == '0' * 40 or
                  re.fullmatch(r'[0-9a-f]{64}', entry) is None or entry == '0' * 64 or
                  re.fullmatch(r'[0-9a-f]{64}', code_manifest) is None or code_manifest == '0' * 64):
              raise SystemExit('v110.disarmed_binding')
          if (os.environ.get('GITHUB_ACTIONS') != 'true' or
                  os.environ.get('RUNNER_ENVIRONMENT') != 'github-hosted' or
                  os.environ.get('RUNNER_OS') != 'Linux' or
                  os.environ.get('GITHUB_REPOSITORY') != 'fr-meyer/openclaw' or
                  os.environ.get('GITHUB_ACTOR') != 'fr-meyer' or
                  os.environ.get('GITHUB_EVENT_NAME') != 'pull_request' or
                  os.environ.get('GITHUB_RUN_ATTEMPT') != '1' or
                  os.environ.get('GITHUB_REF') != 'refs/pull/' + pr + '/merge'):
              raise SystemExit('v110.hosted_identity')
          start, end = utc(os.environ.get('V110_EFFECTIVE_AT')), utc(os.environ.get('V110_EXPIRES_AT'))
          minutes = os.environ.get('V110_JOB_MINUTES', '')
          if re.fullmatch(r'[1-9][0-9]?', minutes) is None or not 1 <= int(minutes) <= 90:
              raise SystemExit('v110.job_limit')
          now = int(time.time())
          if (start != utc('2026-11-03T09:12:23Z') or end != utc('2026-11-06T03:14:21Z') or
                  not max(start, utc('2026-11-04T09:59:50Z')) <= now <= end - int(minutes) * 60 - 60):
              raise SystemExit('v110.authorization_clock')
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('V110_JOB_STARTED_EPOCH=' + str(now) + '\n')
          PY
      - name: Checkout exact pipeline bootstrap only
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fr-meyer/openclaw
          ref: ${{ github.event.pull_request.head.sha }}
          path: pipeline
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Retain truthful fresh-coverage result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I - finalize <<'PY'
          # Fixed stdlib-only closure check: no pipeline import before all bytes match.
          import hashlib, json, os, re, stat, sys
          from pathlib import Path
          sys.dont_write_bytecode = True
          ROOT = Path.cwd() / 'pipeline'
          MANIFEST = 'scripts/fork-release/candidates/v2026.10.10-source-only/code-manifest.json'
          ENTRY = 'scripts/fork-release/source_validation_v110.py'
          IMPORTS = 'scripts/fork-release/verified_imports_v110.py'
          WORKFLOW = '.github/workflows/future-v110-source-validation.yml'
          MAXIMUM = 64 * 1024 * 1024

          def strict_object(pairs):
              if type(pairs) is not list:
                  raise SystemExit('v110.code_manifest_json_constant')
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise SystemExit('v110.code_manifest_duplicate_key')
                  result[key] = value
              return result

          def read_regular(relative, maximum):
              if (type(relative) is not str or
                      re.fullmatch(r'scripts/fork-release/[A-Za-z0-9_./-]+', relative) is None or
                      any(part in ('', '.', '..') or part.startswith('-') for part in relative.split('/'))):
                  raise SystemExit('v110.code_manifest_path')
              try:
                  parent = ROOT
                  if not stat.S_ISDIR(parent.lstat().st_mode):
                      raise SystemExit('v110.code_manifest_directory')
                  for part in relative.split('/')[:-1]:
                      parent = parent / part
                      if not stat.S_ISDIR(parent.lstat().st_mode):
                          raise SystemExit('v110.code_manifest_directory')
                  path = ROOT / relative
                  before = path.lstat()
                  if not stat.S_ISREG(before.st_mode) or before.st_size > maximum:
                      raise SystemExit('v110.code_manifest_regular_file')
                  with os.fdopen(os.open(path, os.O_RDONLY | os.O_NOFOLLOW), 'rb') as stream:
                      opened = os.fstat(stream.fileno())
                      raw = stream.read(maximum + 1)
                      after = os.fstat(stream.fileno())
                  identity = lambda value: (value.st_dev, value.st_ino, value.st_size,
                      value.st_mtime_ns, value.st_ctime_ns)
                  if (identity(before) != identity(opened) or identity(before) != identity(after) or
                          identity(before) != identity(path.lstat()) or len(raw) > maximum):
                      raise SystemExit('v110.code_manifest_file_changed')
                  return raw
              except OSError:
                  raise SystemExit('v110.code_manifest_file_unavailable')

          def verify_code_manifest():
              expected = os.environ.get('V110_CODE_MANIFEST_SHA256', '')
              entry_sha = os.environ.get('V110_ENTRY_SHA256', '')
              if any(re.fullmatch(r'[0-9a-f]{64}', value) is None or value == '0' * 64
                      for value in (expected, entry_sha)):
                  raise SystemExit('v110.code_manifest_unbound')
              raw = read_regular(MANIFEST, 256 * 1024)
              if hashlib.sha256(raw).hexdigest() != expected:
                  raise SystemExit('v110.code_manifest_digest')
              try:
                  manifest = json.loads(raw, object_pairs_hook=strict_object, parse_constant=strict_object)
              except (ValueError, UnicodeError):
                  raise SystemExit('v110.code_manifest_json')
              if (type(manifest) is not dict or set(manifest) != {'schema', 'codeFiles'} or
                      manifest['schema'] != 'openclaw.v110.code-manifest.v1' or
                      type(manifest['codeFiles']) is not dict or not 1 <= len(manifest['codeFiles']) <= 256 or
                      ENTRY not in manifest['codeFiles'] or IMPORTS not in manifest['codeFiles']):
                  raise SystemExit('v110.code_manifest_schema')
              captured, total = {}, 0
              for relative, pin in manifest['codeFiles'].items():
                  if relative in (MANIFEST, WORKFLOW):
                      raise SystemExit('v110.code_manifest_self_or_workflow')
                  if (type(pin) is not dict or set(pin) != {'sha256', 'bytes'} or
                          type(pin['sha256']) is not str or re.fullmatch(r'[0-9a-f]{64}', pin['sha256']) is None or
                          type(pin['bytes']) is not int or not 1 <= pin['bytes'] <= MAXIMUM):
                      raise SystemExit('v110.code_manifest_pin')
                  total += pin['bytes']
                  if total > MAXIMUM:
                      raise SystemExit('v110.code_manifest_total_size')
                  content = read_regular(relative, pin['bytes'])
                  if len(content) != pin['bytes'] or hashlib.sha256(content).hexdigest() != pin['sha256']:
                      raise SystemExit('v110.code_manifest_content')
                  if relative == ENTRY:
                      if pin['sha256'] != entry_sha:
                          raise SystemExit('v110.code_manifest_entry_digest')
                  captured[relative] = content
              return captured

          captured = verify_code_manifest()
          imports_path = ROOT / IMPORTS
          imports_namespace = {'__name__': '_v110_verified_imports', '__file__': str(imports_path)}
          exec(compile(captured[IMPORTS], str(imports_path), 'exec'), imports_namespace)
          closed_builtins = imports_namespace['install_verified_imports'](str(ROOT), captured)
          entry_path = ROOT / ENTRY
          sys.argv = [str(entry_path), *sys.argv[1:]]
          exec(compile(captured[ENTRY], str(entry_path), 'exec'),
              {'__name__': '__main__', '__file__': str(entry_path), '__package__': None,
                  '__builtins__': closed_builtins})
          PY
      - name: Upload bounded safe source result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: v110-source-result-${{ github.run_id }}-attempt1
          path: |
            ${{ runner.temp }}/v110-source-result/source-validation.json
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: false
