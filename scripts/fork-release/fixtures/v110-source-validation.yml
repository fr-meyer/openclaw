              except ValueError:
                  raise SystemExit('v110.disarmed_or_invalid_clock')

          pr = os.environ.get('V110_BOUND_PR', '')
          source = os.environ.get('V110_SOURCE_SHA', '')
          entry = os.environ.get('V110_ENTRY_SHA256', '')
