name: Retain one private OCI archive
description: Disabled by default; prepare, attest and transfer an unqualified OCI archive without granting promotion
inputs:
  enabled:
    description: Explicit separately authorized private retention
    required: false
    default: "false"
  approved-workflow-sha:
    description: Independently approved exact caller workflow commit, never inferred
    required: false
  source-sha:
    description: Exact source commit
    required: false
  source-tree:
    description: Exact source tree
    required: false
  built-at:
    description: Original reproducible build-input timestamp
    required: false
  manifest:
    description: Exact source manifest file
    required: false
  inventory:
    description: Exact source patch inventory file
    required: false
  build-metadata:
    description: Original successful BuildKit metadata file
    required: false
  resources:
    description: Original completed hosted resource observation
    required: false
  oci-directory:
    description: Original OCI layout, not runtime state
    required: false
  output-directory:
    description: New private archive directory below the runner temporary directory
    required: false
  upload-capability:
    description: Private JSON capability envelope; supply only from an approved temporary secret
    required: false
outputs:
  archive-sha256:
    description: Original archive digest; not an image qualification
    value: ${{ steps.prepare.outputs.sha256 }}
  archive-bytes:
    description: Complete archive size
    value: ${{ steps.prepare.outputs.bytes }}
runs:
  using: composite
  steps:
    - name: Check separately authorized private scope
      id: scope
      shell: bash
      env:
        RETAIN_ENABLED: ${{ inputs.enabled }}
        APPROVED_WORKFLOW_SHA: ${{ inputs.approved-workflow-sha }}
        ACTUAL_WORKFLOW_SHA: ${{ github.workflow_sha }}
        SOURCE_SHA: ${{ inputs.source-sha }}
        SOURCE_TREE: ${{ inputs.source-tree }}
      run: |
        python3 - <<'PY_PRIVATE_SCOPE'
        import os
        import re
        from pathlib import Path

        enabled = os.environ.get("RETAIN_ENABLED", "false")
        if enabled not in ("false", "true"):
            raise SystemExit("Private retention scope refused")
        if enabled == "true":
            expected = os.environ.get("APPROVED_WORKFLOW_SHA", "")
            if not (
                re.fullmatch(r"[0-9a-f]{40}", expected) and
                expected == os.environ.get("ACTUAL_WORKFLOW_SHA") == os.environ.get("GITHUB_SHA") and
                os.environ.get("GITHUB_REPOSITORY") == "fr-meyer/openclaw" and
                os.environ.get("GITHUB_ACTOR") == "fr-meyer" and
                os.environ.get("GITHUB_EVENT_NAME") in ("workflow_dispatch", "push") and
                os.environ.get("GITHUB_RUN_ATTEMPT") == "1" and
                re.fullmatch(r"[1-9][0-9]*", os.environ.get("GITHUB_RUN_ID", "")) and
                os.environ.get("SOURCE_SHA") == "85a9bdc1285c338f10f5ca818abc259f6d483b5b" and
                os.environ.get("SOURCE_TREE") == "3e0d6fbf5bc015063dce3e4f0f353f0eac3aed6a"
            ):
                raise SystemExit("Private retention scope refused")
        with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
            print("enabled=" + enabled, file=output)
        PY_PRIVATE_SCOPE
    - name: Prepare exact opaque private archive
      if: steps.scope.outputs.enabled == 'true'
      id: prepare
      shell: bash
      env:
        SOURCE_SHA: ${{ inputs.source-sha }}
        SOURCE_TREE: ${{ inputs.source-tree }}
        WORKFLOW_SHA: ${{ github.workflow_sha }}
        BUILT_AT: ${{ inputs.built-at }}
        MANIFEST: ${{ inputs.manifest }}
        INVENTORY: ${{ inputs.inventory }}
        BUILD_METADATA: ${{ inputs.build-metadata }}
        RESOURCES: ${{ inputs.resources }}
        OCI_DIRECTORY: ${{ inputs.oci-directory }}
        OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
      run: |
        set -euo pipefail
        umask 077
        python3 - "$OUTPUT_DIRECTORY" "$RUNNER_TEMP" <<'PY_PRIVATE_PATH'
        import pathlib
        import sys
        root, parent = (pathlib.Path(value).absolute() for value in sys.argv[1:])
        if parent.resolve() != parent or root.parent.resolve() != root.parent or parent not in root.parents:
            raise SystemExit("Private output location refused")
        PY_PRIVATE_PATH
        python3 - <<'PY_PRIVATE_OUTPUT'
        import json
        import os
        from pathlib import Path
        import re
        import subprocess
        import sys

        stage = "private_oci_prepare"
        refusal = "private_bundle_invalid_changed_or_over_limit"
        unavailable = "private_prepare_diagnostic_unavailable"

        def failed(reason, code=None):
            value = {"status": "failed", "reason": reason, "stage": stage}
            if code is not None:
                value["refusalCode"] = code
            print(json.dumps(value, sort_keys=True))

        try:
            root = Path(os.environ["OUTPUT_DIRECTORY"])
            helper = Path(os.environ["GITHUB_ACTION_PATH"], "../../../scripts/fork-release/private_oci_bundle.py")
            sys.path.insert(0, str(helper.resolve().parent))
            import hosted_privacy
            allowed_codes = frozenset(('output_identity_changed', 'archive_changed', 'archive_hash', 'archive_hash_changed', 'archive_hash_mismatch', 'archive_header_changed', 'archive_member_changed', 'archive_not_private_regular_or_size', 'archive_padding_changed', 'archive_permissions', 'archive_size_limit', 'archive_tail_changed', 'archive_truncated', 'archive_type_or_size', 'artifact_name', 'blob_count_limit', 'blob_digest_mismatch', 'blob_size_changed', 'build_time', 'bundle_changed', 'bundle_directory_permissions', 'bundle_directory_type', 'bundle_identity', 'bundle_permissions', 'bundle_receipt_changed', 'bundle_receipt_permissions', 'bundle_receipt_schema', 'bundle_size_limit', 'control_hash_changed', 'control_paths', 'control_size', 'docker_descriptor_binding', 'docker_metadata_binding', 'expected_hash', 'expected_identity', 'expected_producer_changed', 'expected_size', 'export_entry_limit', 'export_inventory_changed', 'export_inventory_invalid', 'export_inventory_parent', 'export_path_refused', 'export_qualification_changed_or_not_approved', 'export_type_or_link', 'incomplete_namespace', 'input_changed', 'input_count_limit', 'input_digest_changed', 'input_directory_type', 'input_hardlink', 'input_invalid', 'input_path', 'input_root_changed', 'input_root_symlink', 'input_type_or_size', 'invalid_arguments', 'invalid_header', 'invalid_size_limit', 'inventory_binding', 'inventory_member_hash', 'inventory_member_mismatch', 'inventory_parent_missing', 'io_refused', 'manifest_binding', 'member_namespace_refused', 'member_not_allowed', 'member_order_or_duplicate', 'member_size', 'metadata_privacy_findings', 'missing_input', 'missing_oci_entry', 'noncanonical_archive_size', 'noncanonical_or_nonregular_header', 'nonzero_archive_tail', 'nonzero_member_padding', 'oci_image_binding_changed', 'oci_inventory_changed', 'origin_binding', 'origin_hashes', 'original_control_changed', 'output_directory_not_fresh', 'output_exists', 'output_overlap', 'output_overlaps_input', 'output_owner', 'parent_not_private_owned', 'path_identity_changed', 'path_not_canonical', 'paths_overlap', 'producer_binding', 'read_bound_or_truncated', 'receipt_exists', 'receipt_overlaps_bundle_or_input', 'receipt_privacy_findings', 'receipt_short_write', 'resources_binding', 'unexpected_bundle_file', 'unexpected_control_file', 'unexpected_input'))
            structure = hosted_privacy.inspect_export_structure(os.environ["OCI_DIRECTORY"])
            print(json.dumps({"recordType": "export_structure", **structure}, sort_keys=True), flush=True)
            command = [sys.executable, "-B", str(helper), "prepare-from-build"]
            for name, value in (
                ("manifest", os.environ["MANIFEST"]), ("inventory", os.environ["INVENTORY"]),
                ("build-metadata", os.environ["BUILD_METADATA"]), ("resources", os.environ["RESOURCES"]),
                ("oci-dir", os.environ["OCI_DIRECTORY"]), ("output-dir", str(root)),
                ("output", str(root) + "-retention.json"), ("source-sha", os.environ["SOURCE_SHA"]),
                ("source-tree", os.environ["SOURCE_TREE"]), ("workflow-sha", os.environ["WORKFLOW_SHA"]),
                ("run-id", os.environ["GITHUB_RUN_ID"]), ("attempt", os.environ["GITHUB_RUN_ATTEMPT"]),
                ("built-at", os.environ["BUILT_AT"]),
            ):
                command.extend(["--" + name, value])
            flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW
            with os.fdopen(os.open(str(root) + "-prepare-output.json", flags, 0o600), "wb") as output, \
                 os.fdopen(os.open(str(root) + "-prepare-error.log", flags, 0o600), "wb") as errors:
                completed = subprocess.run(command, stdout=output, stderr=errors, check=False)
            with Path(str(root) + "-prepare-output.json").open("rb") as output:
                raw = output.read(65537)
            try:
                value = json.loads(raw) if len(raw) <= 65536 else None
            except (ValueError, RecursionError):
                value = None
            if completed.returncode != 0:
                reason = refusal if isinstance(value, dict) and value.get("status") == "failed" and value.get("reason") == refusal else unavailable
                code = value.get("refusalCode") if isinstance(value, dict) else None
                failed(reason, code if isinstance(code, str) and code in allowed_codes else "input_invalid")
                raise SystemExit(completed.returncode if completed.returncode > 0 else 128 - completed.returncode)
            result = json.loads(Path(str(root) + "-retention.json").read_bytes())
            digest, size = result.get("archiveSha256"), result.get("archiveBytes")
            if not (isinstance(value, dict) and value.get("status") == result.get("status") == "prepared" and
                    isinstance(digest, str) and re.fullmatch(r"[0-9a-f]{64}", digest) and
                    type(size) is int and 0 < size <= 2147483648 and
                    value.get("archiveSha256") == digest and type(value.get("archiveBytes")) is int and
                    value.get("archiveBytes") == size):
                raise ValueError()
            with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
                print("sha256=" + digest, file=output)
                print("bytes=" + str(size), file=output)
            print(json.dumps({"status": "prepared", "stage": stage,
                              "archiveSha256": digest, "archiveBytes": size}, sort_keys=True))
        except Exception:
            failed(unavailable)
            raise SystemExit(1) from None
        PY_PRIVATE_OUTPUT
    - name: Attest retained private OCI archive
      if: steps.scope.outputs.enabled == 'true' && steps.prepare.outcome == 'success'
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-digest: sha256:${{ steps.prepare.outputs.sha256 }}
        subject-name: retained-oci.tar
        push-to-registry: false
        create-storage-record: false
        show-summary: false
    - name: Transfer only the approved private object
      if: steps.scope.outputs.enabled == 'true' && steps.prepare.outcome == 'success'
      shell: bash
      env:
        OCI_UPLOAD_ENVELOPE: ${{ inputs.upload-capability }}
        OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
      run: |
        set -euo pipefail
        umask 077
        python3 - <<'PY_PRIVATE_PLAN'
        import hashlib
        import json
        import os
        import subprocess
        from pathlib import Path

        root = Path(os.environ["OUTPUT_DIRECTORY"])
        result = json.loads(Path(str(root) + "-retention.json").read_bytes())
        source = "85a9bdc1285c338f10f5ca818abc259f6d483b5b"
        try:
            raw_envelope = os.environ["OCI_UPLOAD_ENVELOPE"]
            if len(raw_envelope) > 32768:
                raise ValueError()
            envelope = json.loads(raw_envelope)
            if not (
                isinstance(envelope, dict) and
                set(envelope) == {"schema", "sourceSha", "workflowSha", "bucket", "object", "signer", "url"} and
                envelope["schema"] == "openclaw.private-oci-capability.v1" and
                envelope["sourceSha"] == source and envelope["workflowSha"] == os.environ["GITHUB_SHA"]
            ):
                raise ValueError()
        except (KeyError, TypeError, ValueError):
            raise SystemExit("Private capability envelope refused") from None
        plan = {
            "schema": "openclaw.private-oci-transfer-plan.v1", "sourceSha": source,
            "toolingSha": os.environ["GITHUB_SHA"], "runId": os.environ["GITHUB_RUN_ID"],
            "attempt": os.environ["GITHUB_RUN_ATTEMPT"], "archiveSha256": result["archiveSha256"],
            "archiveBytes": result["archiveBytes"],
            "bucket": envelope["bucket"], "object": envelope["object"], "signer": envelope["signer"],
            "generation": None,
        }
        raw = (json.dumps(plan, sort_keys=True, separators=(",", ":")) + "\n").encode()
        with (root / "transfer-plan.json").open("xb") as output:
            output.write(raw)
        helper = Path(os.environ["GITHUB_ACTION_PATH"], "../../../scripts/fork-release/private_oci_transfer.py")
        child_environment = dict(os.environ)
        child_environment.pop("OCI_UPLOAD_ENVELOPE", None)
        child_environment["OCI_UPLOAD_CAPABILITY"] = envelope["url"]
        status = subprocess.run([
            "python3", "-B", str(helper), "put", "--plan", str(root / "transfer-plan.json"),
            "--plan-sha256", hashlib.sha256(raw).hexdigest(), "--capability-env", "OCI_UPLOAD_CAPABILITY",
            "--archive", str(root / "retained-oci.tar"), "--receipt", str(root / "transfer.json"),
        ], env=child_environment, check=False).returncode
        raise SystemExit(status)
        PY_PRIVATE_PLAN
