name: YouTube passive namespace diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: youtube-passive-namespace-diagnostics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    if: github.repository == 'fr-meyer/openclaw' && github.event.repository.fork == true && github.event.repository.private == false && github.ref == 'refs/heads/fix/youtube-notification-only-deploy-20261008' && github.event_name == 'workflow_dispatch' && github.actor == 'fr-meyer' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Collect bounded passive runner facts and remove owned receipt
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S -B - <<'PY'
          """Passive bounded runner snapshot; does not invoke an OCI runtime or launcher.
          
          Prepared for a separately approved secretless hosted diagnostics job. This file
          has not been run against the Mac, Windows, GCP, or a new hosted runner.
          """
          
          import hashlib
          import json
          import os
          from pathlib import Path
          import stat
          
          
          TEXT_LIMIT = 65536
          HASH_FILE_LIMIT = 25 * 1024 * 1024
          HASH_TOTAL_LIMIT = 120 * 1024 * 1024
          OUTPUT_LIMIT = 128 * 1024
          CONSOLE_OVERHEAD = 1024
          BINARY_PATHS = (
              "/usr/bin/unshare", "/usr/bin/podman", "/usr/bin/conmon", "/usr/bin/crun",
              "/usr/bin/runc", "/usr/bin/newuidmap", "/usr/bin/newgidmap", "/usr/bin/rootlesskit",
          )
          POLICY_PATHS = (
              "/proc/self/attr/current", "/proc/self/attr/apparmor/current",
              "/sys/module/apparmor/parameters/enabled",
              "/proc/sys/kernel/apparmor_restrict_unprivileged_userns",
              "/proc/sys/kernel/apparmor_restrict_unprivileged_unconfined",
              "/proc/sys/kernel/unprivileged_userns_clone", "/proc/sys/user/max_user_namespaces",
          )
          
          
          def bounded_text(path):
              try:
                  with open(path, "rb", buffering=0) as handle:
                      data = handle.read(TEXT_LIMIT + 1)
                  if len(data) > TEXT_LIMIT:
                      return {"state": "over_limit"}
                  return {"state": "read", "text": data.decode("utf-8", "replace").strip()}
              except FileNotFoundError:
                  return {"state": "absent"}
              except PermissionError:
                  return {"state": "unreadable"}
              except OSError as exc:
                  return {"state": "error", "errno": exc.errno}
          
          
          def hash_binary(path, used):
              reserved = 0
              try:
                  resolved = Path(path).resolve(strict=True)
                  with open(resolved, "rb", buffering=0) as handle:
                      before = os.fstat(handle.fileno())
                      if not stat.S_ISREG(before.st_mode):
                          return {"state": "not_regular"}, used
                      if before.st_size > HASH_FILE_LIMIT or used + before.st_size > HASH_TOTAL_LIMIT:
                          return {"state": "over_limit", "bytes": before.st_size}, used
                      # Reserve the entire bounded target before any read. On a partial
                      # I/O failure no already-read bytes disappear from the shared cap.
                      reserved = before.st_size
                      sha = hashlib.sha256()
                      read = 0
                      while read < before.st_size:
                          chunk = handle.read(min(1024 * 1024, before.st_size - read))
                          if not chunk:
                              break
                          sha.update(chunk)
                          read += len(chunk)
                      after = os.fstat(handle.fileno())
                      identity = lambda s: (s.st_dev, s.st_ino, s.st_size, s.st_mtime_ns, s.st_ctime_ns)
                      if read != before.st_size or identity(before) != identity(after):
                          return {"state": "changed_during_read"}, used + reserved
                      return {"state": "hashed", "path": str(resolved), "bytes": read,
                              "sha256": sha.hexdigest(), "owner_uid": before.st_uid,
                              "mode": oct(stat.S_IMODE(before.st_mode))}, used + reserved
              except FileNotFoundError:
                  return {"state": "absent"}, used + reserved
              except PermissionError:
                  return {"state": "unreadable"}, used + reserved
              except OSError as exc:
                  return {"state": "error", "errno": exc.errno}, used + reserved
          
          
          def mappings(path, uid, passwd_path="/etc/passwd"):
              raw = bounded_text(path)
              if raw["state"] != "read":
                  return raw
              passwd = bounded_text(passwd_path)
              if passwd["state"] != "read":
                  return {"state": "current_account_unresolved"}
              accounts = []
              for line in passwd["text"].splitlines():
                  fields = line.split(":")
                  if len(fields) >= 4 and fields[2] == str(uid):
                      accounts.append(fields[0])
              if len(accounts) != 1:
                  return {"state": "current_account_unresolved"}
              account = accounts[0]
              matches = []
              for line in raw["text"].splitlines():
                  fields = line.split(":")
                  if len(fields) == 3 and fields[0] in (account, str(uid)):
                      try:
                          matches.append({"start": int(fields[1]), "count": int(fields[2])})
                      except ValueError:
                          return {"state": "malformed_current_account_entry"}
              # Never emit other accounts or the account's personal name.
              return {"state": "read", "current_account_ranges": matches}
          
          
          def socket_metadata(path, uid):
              try:
                  value = os.lstat(path)
                  return {"state": "present", "is_socket": stat.S_ISSOCK(value.st_mode),
                          "owned_by_runner": value.st_uid == uid,
                          "is_symlink": stat.S_ISLNK(value.st_mode)}
              except FileNotFoundError:
                  return {"state": "absent"}
              except PermissionError:
                  return {"state": "unreadable"}
          
          
          def collect():
              uid = os.geteuid()
              snapshot = {
                  "schema": "passive-runner-capability-snapshot.v1",
                  "runner_uid": uid, "runner_gid": os.getegid(),
                  "kernel": os.uname().release,
                  "identity_scope": "current hosted runner; not a replay of the earlier host",
                  "policy": {p: bounded_text(p) for p in POLICY_PATHS},
                  "subordinate_uid": mappings("/etc/subuid", uid),
                  "subordinate_gid": mappings("/etc/subgid", uid),
                  "binary_hashes": {},
                  "namespace_proof": "not attempted",
                  "rootless_runtime_permission": "not established by passive snapshot",
                  "usable_image_and_tool_closure": "not established",
                  "canonical_checks_executed": 0,
              }
              status = bounded_text("/proc/self/status")
              snapshot["process_security"] = {"state": status["state"]}
              if status["state"] == "read":
                  keys = ("Uid:", "Gid:", "CapInh:", "CapPrm:", "CapEff:", "CapBnd:",
                          "CapAmb:", "NoNewPrivs:", "Seccomp:", "Seccomp_filters:", "NSpid:")
                  snapshot["process_security"]["fields"] = [line for line in status["text"].splitlines()
                                                             if line.startswith(keys)]
              used = 0
              for path in BINARY_PATHS:
                  snapshot["binary_hashes"][path], used = hash_binary(path, used)
              snapshot["binary_budget_charged_bytes"] = used
              snapshot["existing_rootless_socket_metadata"] = {
                  p: socket_metadata(p, uid) for p in
                  (f"/run/user/{uid}/podman/podman.sock", f"/run/user/{uid}/docker.sock")
              }
              snapshot["operations"] = {
                  "runtime_initialization": False, "socket_connections": 0,
                  "subprocesses": 0, "image_pulls": 0, "downloads": 0, "configuration_writes": 0,
              }
              encoded = json.dumps(snapshot, sort_keys=True)
              if len(encoded.encode()) > OUTPUT_LIMIT - CONSOLE_OVERHEAD:
                  raise ValueError("sanitized snapshot exceeds output budget")
              return encoded
          
          
          import signal
          
          def interrupted(signum, frame):
              raise KeyboardInterrupt("passive diagnostics interrupted")
          
          signal.signal(signal.SIGTERM, interrupted)
          run = os.environ["GITHUB_RUN_ID"]
          attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          assert run.isdecimal() and attempt == "1"
          temp = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
          owned = temp / ("youtube-passive-diagnostics-" + run + "-" + attempt)
          allocated = False
          try:
              owned.mkdir(mode=0o700)
              allocated = True
              snapshot = collect()
              receipt = owned / "sanitized-snapshot.json"
              receipt.write_text(snapshot + "\n", encoding="utf-8")
              print(snapshot)
          finally:
              if allocated:
                  receipt = owned / "sanitized-snapshot.json"
                  if receipt.exists():
                      assert receipt.is_file() and not receipt.is_symlink()
                      receipt.unlink()
                  owned.rmdir()
                  print('{"state":"owned_diagnostic_files_removed","children_started":0}')
              else:
                  print('{"state":"allocation_unconfirmed_preserved_for_platform_disposal"}')
          PY
