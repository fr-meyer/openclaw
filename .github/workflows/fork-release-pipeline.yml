name: Fork PR and release qualification

on:
  pull_request:
    types:
      [
        opened,
        reopened,
        synchronize,
        ready_for_review,
        converted_to_draft,
        edited,
        assigned,
        unassigned,
      ]
  push:
    branches:
      - release-pipeline/**
    paths:
      - .github/workflows/fork-release-pipeline.yml
      - scripts/fork-release/**
      - scripts/docker-release-artifacts.mjs
  workflow_dispatch:
    inputs:
      candidate_head_sha:
        description: Exact candidate metadata-seal commit (40 lowercase hex characters)
        required: true
        type: string
      export_public_artifact:
        description: Publish the verified OCI image and receipts as a public Actions artifact
        required: false
        default: false
        type: boolean
      artifact_storage_approved:
        description: Confirm included storage allowance or separately approved artifact storage cost
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Candidate tests run on this runner; deny cross-run cache access at the token boundary.
cache-mode: none

concurrency:
  group: fork-release-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  hosted-capacity-assessment:
    if: >-
      ${{ github.event_name == 'pull_request' && github.repository == 'fr-meyer/openclaw' &&
          github.event.pull_request.head.repo.full_name == 'fr-meyer/openclaw' &&
          github.event.pull_request.head.ref == 'task/v106-merge-binding' &&
          github.event.pull_request.number == 20 &&
          (github.event.action == 'opened' || github.event.action == 'reopened' ||
           github.event.action == 'synchronize' || github.event.action == 'ready_for_review') }}
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Observe hosted runner capacity without a build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CAPACITY'
          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path
          import platform
          import re
          import subprocess

          def version(argv):
              try:
                  result = subprocess.run(argv, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL,
                                          text=True, check=False, timeout=10)
              except (OSError, subprocess.TimeoutExpired):
                  return {"status": "unavailable"}
              value = result.stdout.strip()
              if result.returncode != 0 or not re.fullmatch(r"[A-Za-z0-9 .,_+:/()@-]{1,256}", value):
                  return {"status": "unavailable"}
              return {"status": "ok", "version": value}

          memory = {}
          for line in Path('/proc/meminfo').read_text().splitlines():
              key, value = line.split(':', 1)
              if key in ('MemTotal', 'MemAvailable'):
                  memory[key + 'Bytes'] = int(value.split()[0]) * 1024
          os_release = dict(line.split('=', 1) for line in Path('/etc/os-release').read_text().splitlines()
                            if '=' in line and not line.startswith('#'))
          operating_system = {key: os_release.get(key, '').strip('"') for key in ('ID', 'VERSION_ID')}
          if any(not re.fullmatch(r"[A-Za-z0-9._-]{1,64}", value) for value in operating_system.values()):
              raise SystemExit('Unsupported OS metadata')
          disks = {}
          for name, path in (('root', '/'), ('tmp', '/tmp')):
              stats = os.statvfs(path)
              disks[name] = {"totalBytes": stats.f_blocks * stats.f_frsize,
                             "availableBytes": stats.f_bavail * stats.f_frsize}
          print(json.dumps({"schema": "openclaw.hosted-capacity.v1",
                            "observedAt": datetime.now(timezone.utc).isoformat(),
                            "os": operating_system, "architecture": platform.machine(),
                            "logicalCpus": os.cpu_count(), "memory": memory, "filesystems": disks,
                            "dockerCli": version(['docker', '--version']),
                            "dockerServer": version(['docker', 'version', '--format', '{{.Server.Version}}']),
                            "buildx": version(['docker', 'buildx', 'version'])}, sort_keys=True))
          PY_CAPACITY

  pr-intake:
    if: >-
      ${{ github.event_name == 'pull_request' && github.repository == 'fr-meyer/openclaw' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (startsWith(github.event.pull_request.head.ref, 'task/') ||
           startsWith(github.event.pull_request.head.ref, 'candidate/')) &&
          (github.event.action != 'edited' || github.event.changes.body != null || github.event.changes.base != null) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted PR contract from exact base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: scripts/fork-release
          persist-credentials: false
      - name: Bind declared owner, dependencies and check to head/base
        env:
          CHECK_RUN_ID: ${{ job.check_run_id }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          python3 trusted/scripts/fork-release/pr.py intake \
            --event "$GITHUB_EVENT_PATH" --output "$RUNNER_TEMP/fork-pr-evidence.json"
          cat "$RUNNER_TEMP/fork-pr-evidence.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain exact PR intake evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fork-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.event.pull_request.base.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fork-pr-evidence.json
          retention-days: 14
          if-no-files-found: error

  release-pr-contracts:
    if: >-
      ${{ github.event_name == 'pull_request' && github.repository == 'fr-meyer/openclaw' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.event.pull_request.head.ref, 'candidate/') &&
          github.event.action != 'assigned' && github.event.action != 'unassigned' &&
          needs.pr-intake.result == 'success' }}
    needs: pr-intake
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout trusted PR contract from exact base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts/fork-release
            scripts/lib
            .github/workflows/clawsweeper-dispatch.yml
          persist-credentials: false
      - name: Checkout exact candidate PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 66
          persist-credentials: false
      - name: Resolve reviewed metadata and retain upstream tag object
        id: candidate
        run: |
          set -euo pipefail
          python3 trusted/scripts/fork-release/release.py identity \
            --manifest candidate/scripts/fork-release/manifest.json \
            --inventory candidate/scripts/fork-release/patch-inventory.json >> "$GITHUB_OUTPUT"
      - name: Seal exact PR head, base and changed product diff
        id: seal
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHECK_RUN_ID: ${{ job.check_run_id }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          git -C candidate fetch --no-tags --depth=1 origin "$BASE_SHA"
          TAG='${{ steps.candidate.outputs.upstream_tag }}'
          if [[ -n "$TAG" ]]; then
            git -C candidate fetch --no-tags --depth=1 https://github.com/openclaw/openclaw.git "refs/tags/$TAG"
          fi
          HISTORY_COMMITS='${{ steps.candidate.outputs.history_commits }}'
          for COMMIT in $HISTORY_COMMITS; do
            if ! git -C candidate cat-file -e "$COMMIT^{commit}" 2>/dev/null; then
              git -C candidate fetch --no-tags --depth=1 origin "$COMMIT"
            fi
          done
          python3 trusted/scripts/fork-release/source_ancestry.py \
            --manifest candidate/scripts/fork-release/manifest.json \
            --inventory candidate/scripts/fork-release/patch-inventory.json --source-dir candidate
          python3 trusted/scripts/fork-release/pr.py seal \
            --event "$GITHUB_EVENT_PATH" \
            --manifest candidate/scripts/fork-release/manifest.json \
            --checkout candidate --output "$RUNNER_TEMP/release-pr-evidence.json"
          python3 -c 'import json,os; e=json.load(open(os.environ["RUNNER_TEMP"]+"/release-pr-evidence.json")); print("source_sha="+e["sourceSha"])' >> "$GITHUB_OUTPUT"
      - name: Checkout exact product source and patch ancestry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.seal.outputs.source_sha }}
          path: source
          fetch-depth: 65
          persist-credentials: false
      - name: Setup supported Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.candidate.outputs.node_version }}
          package-manager-cache: false
      - name: Verify source, manifest and offline PR regressions
        run: |
          set -euo pipefail
          TAG='${{ steps.candidate.outputs.upstream_tag }}'
          if [[ -n "$TAG" ]]; then
            git -C source fetch --no-tags --depth=1 https://github.com/openclaw/openclaw.git "refs/tags/$TAG"
          fi
          HISTORY_COMMITS='${{ steps.candidate.outputs.history_commits }}'
          for COMMIT in $HISTORY_COMMITS; do
            if ! git -C source cat-file -e "$COMMIT^{commit}" 2>/dev/null; then
              git -C source fetch --no-tags --depth=1 origin "$COMMIT"
            fi
          done
          python3 trusted/scripts/fork-release/source_ancestry.py \
            --manifest candidate/scripts/fork-release/manifest.json \
            --inventory candidate/scripts/fork-release/patch-inventory.json --source-dir source
          python3 trusted/scripts/fork-release/preflight.py \
            --manifest candidate/scripts/fork-release/manifest.json \
            --inventory candidate/scripts/fork-release/patch-inventory.json --source-dir source
          python3 -m unittest discover -s trusted/scripts/fork-release -p 'test_*.py'
      - name: Run focused candidate lifecycle and producer-consumer tests
        run: |
          set -euo pipefail
          cd source
          corepack enable
          pnpm install --frozen-lockfile
          mapfile -t tests < <(python3 ../trusted/scripts/fork-release/release.py gates \
            --manifest ../candidate/scripts/fork-release/manifest.json \
            --inventory ../candidate/scripts/fork-release/patch-inventory.json)
          if [[ -z "${tests[*]-}" ]]; then
            echo "No source regression gates selected" >&2
            exit 78
          fi
          vitest_tests=()
          native_tests=()
          for test_path in "${tests[@]}"; do
            case "$test_path" in
              *.test.mjs|*.e2e.mjs) native_tests+=("$test_path") ;;
              *) vitest_tests+=("$test_path") ;;
            esac
            # Preserve the older MCP producer's declared native prerequisite.
            if [[ "$test_path" == "src/agents/mcp-http-transport.test.ts" &&
                  " ${tests[*]} " != *" test/mcp-nowistay-sdk-regression.test.mjs "* ]]; then
              native_tests+=(test/mcp-nowistay-sdk-regression.test.mjs)
            fi
          done
          if [[ -n "${vitest_tests[*]-}" ]]; then
            OPENCLAW_VITEST_MAX_WORKERS=2 node scripts/run-vitest.mjs run "${vitest_tests[@]}"
          fi
          if [[ -n "${native_tests[*]-}" ]]; then
            native_args=(--source-root "$PWD")
            if [[ -n "${vitest_tests[*]-}" ]]; then
              for test_path in "${vitest_tests[@]}"; do
                native_args+=(--completed-vitest "$test_path")
              done
            fi
            node ../trusted/scripts/fork-release/native_tests.mjs "${native_args[@]}" -- "${native_tests[@]}"
          fi
      - name: Retain passing exact-head contract evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fork-release-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.event.pull_request.base.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-pr-evidence.json
          retention-days: 14
          if-no-files-found: error

  qualify-and-prepare:
    if: >-
      ${{ github.event_name != 'pull_request' && github.repository == 'fr-meyer/openclaw' &&
          (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') &&
          (github.ref != 'refs/heads/release-pipeline/v105-image-only-20261024' ||
           (github.event_name == 'push' && github.event.created == false &&
            github.event.before == 'a65f70c5dad17b39bc3ee26ba92cde6d00bfb259' &&
            github.run_attempt == '1' && github.actor == 'fr-meyer')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Validate manual candidate identity before checkout
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_HEAD_SHA: ${{ inputs.candidate_head_sha }}
          PUBLIC_EXPORT: ${{ inputs.export_public_artifact }}
          STORAGE_APPROVED: ${{ inputs.artifact_storage_approved }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$PUBLIC_EXPORT" == true && "$STORAGE_APPROVED" != true ]]; then
            echo 'Public image artifact storage must be explicitly approved before building.' >&2
            exit 1
          fi
      - name: Checkout trusted pipeline tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tooling
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout exact candidate metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_head_sha || github.sha }}
          path: metadata
          # Seal + at most 64 ordered source patches + source base.
          fetch-depth: 66
          persist-credentials: false
      - name: Confirm candidate metadata commit
        env:
          CANDIDATE_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_head_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git -C metadata rev-parse HEAD)" == "$CANDIDATE_HEAD_SHA" ]]
      - name: Resolve exact source identity
        id: identity
        env:
          # GitHub extracts only the public approval SHA; the capability itself
          # reaches a process only in the final composite transfer step.
          APPROVED_PRIVATE_WORKFLOW_SHA: ${{ github.ref == 'refs/heads/release-pipeline/v105-image-only-20261024' && fromJSON(secrets.OPENCLAW_PRIVATE_OCI_CAPABILITY || '{}').workflowSha || '' }}
          ACTUAL_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          # One approved private-retention build. Prior physical builds stay
          # consumed; the external capability binds this reviewed workflow SHA.
          python3 - <<'PY_IMAGE_ONLY'
          import json
          import os
          import re
          from pathlib import Path
          from urllib.request import Request, urlopen

          image_ref = 'refs/heads/release-pipeline/v105-image-only-20261024'
          image_source = '30786562e236aab6a924981c62aa61b920132c76'
          selected = os.environ['GITHUB_REF'] == image_ref
          if selected:
              event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
              manifest = json.loads(Path('metadata/scripts/fork-release/manifest.json').read_text())
              approved = os.environ.get('APPROVED_PRIVATE_WORKFLOW_SHA', '')
              if not (
                  re.fullmatch(r'[0-9a-f]{40}', approved) and
                  approved == os.environ.get('ACTUAL_WORKFLOW_SHA') == os.environ['GITHUB_SHA'] and
                  os.environ['GITHUB_EVENT_NAME'] == 'push' and
                  os.environ['GITHUB_REPOSITORY'] == 'fr-meyer/openclaw' and
                  os.environ['GITHUB_ACTOR'] == 'fr-meyer' and
                  os.environ['GITHUB_RUN_ATTEMPT'] == '1' and
                  event.get('created') is False and
                  event.get('before') == 'a65f70c5dad17b39bc3ee26ba92cde6d00bfb259' and
                  event.get('after') == os.environ['GITHUB_SHA'] and
                  manifest.get('repository') == 'fr-meyer/openclaw' and
                  manifest.get('productionEligible') is False and
                  'review' not in manifest and
                  manifest.get('source', {}).get('commit') == image_source and
                  manifest.get('source', {}).get('tree') == '2c7d245a5abe5b4ecfd4477f7890f00aaa3deeff' and
                  manifest.get('image') == {'architecture': 'amd64', 'extensions': 'codex,workboard'}
              ):
                  raise SystemExit('One-shot nonproduction image scope changed')
              def public_json(path):
                  request = Request('https://api.github.com/repos/fr-meyer/openclaw' + path,
                      headers={'Accept': 'application/vnd.github+json',
                               'X-GitHub-Api-Version': '2022-11-28',
                               'User-Agent': 'openclaw-owned-image-qualification'})
                  with urlopen(request, timeout=15) as response:
                      raw = response.read(256 * 1024 + 1)
                  if len(raw) > 256 * 1024:
                      raise SystemExit('One-shot image metadata exceeds bounded response')
                  value = json.loads(raw)
                  if not isinstance(value, dict):
                      raise SystemExit('One-shot image metadata is incomplete')
                  return value

              current_commit = public_json('/git/commits/' + os.environ['GITHUB_SHA'])
              parents = current_commit.get('parents')
              if not (current_commit.get('sha') == approved and isinstance(parents, list) and
                      len(parents) == 1 and isinstance(parents[0], dict) and
                      parents[0].get('sha') == 'b632bd947862f71dfb278b4bca9d9ba26367c7ac'):
                  raise SystemExit('Private caller is not the exact reviewed preparation successor')

              # Preserve all ten consumed prior outcomes. The latest build
              # retained private bytes after privacy refused; it is not a retry grant.
              priors = {
                  40062126779: ('aee8475917dd29e0ee9a0b4059daf34990cfdbd5', 120777706110),
                  40062948481: ('9c2df877355c763ccd9b939250de4384ff80b586', 120780156996),
                  40063895699: ('e7f32458be156cc489f76fd7cc68d35c5c1e1986', 120782979034),
                  40067322318: ('cf145a4c2afb999f06b3ced1f5a2b69e23929eae', 120793190410),
                  40070695622: ('0d5edcd62b511ef8b4472d15bbd330f2bf93e6a1', 120803275519),
                  40075559894: ('a1c3837ba9d8e33a6964a8208ef74d339d6aa635', 120818019684),
                  40098041073: ('b572943a2137c43afd433f7b782a54e12cf13902', 120884304655),
                  40100140347: ('272ce7e9eab02aa36da875b35ea862e8b1a1dbfe', 120890424635),
                  40108417145: ('c5f6ea725b69740582e8051c974a798feda792ba', 120914843959),
                  40149784070: ('a65f70c5dad17b39bc3ee26ba92cde6d00bfb259', 121038697438),
              }
              built_priors = {40063895699, 40067322318, 40070695622, 40075559894, 40100140347, 40108417145, 40149784070}
              private_preflight_priors = {40098041073}
              private_retention_failure_priors = {40100140347, 40108417145}
              private_retention_success_priors = {40149784070}
              history = public_json('/actions/workflows/fork-release-pipeline.yml/runs?'
                  'event=push&per_page=20&branch=release-pipeline%2Fv105-image-only-20261024')
              runs = history.get('workflow_runs')
              current = [r for r in runs or [] if isinstance(r, dict) and
                         type(r.get('id')) is int and str(r['id']) == os.environ['GITHUB_RUN_ID']]
              if not (
                  type(history.get('total_count')) is int and history['total_count'] == 11 and
                  isinstance(runs, list) and len(runs) == 11 and len(current) == 1 and
                  current[0]['id'] not in priors and
                  current[0].get('head_sha') == os.environ['GITHUB_SHA'] and
                  all(isinstance(r, dict) and type(r.get('id')) is int and
                      r.get('head_branch') == image_ref.removeprefix('refs/heads/') and
                      r.get('event') == 'push' and type(r.get('run_attempt')) is int and
                      r['run_attempt'] == 1 for r in runs) and
                  {r['id'] for r in runs} == set(priors) | {current[0]['id']}
              ):
                  raise SystemExit('One-shot image run already claimed or history incomplete')
              expected = {'Verify source and run offline pipeline regressions': 'failure',
                          'Set up bounded hosted Docker Buildx': 'skipped',
                          'Verify hosted worker limits and begin bounded resource observation': 'skipped',
                          'Prepare OCI directory': 'skipped',
                          'Build exact candidate once into OCI': 'skipped',
                          'Inspect all OCI layers and metadata before native smoke or publication': 'skipped',
                          'Verify OCI bytes and smoke that exact image': 'skipped',
                          'Finish resource observation through export load and native verification': 'skipped',
                          'Bind hosted qualification receipts and export decision': 'skipped',
                          'Prepare and verify the bounded public artifact': 'skipped',
                          'Retain the exact tested OCI payload and public receipt': 'skipped',
                          'Confirm uploaded bytes match the bounded artifact': 'skipped'}
              built_expected = {**expected,
                  'Verify source and run offline pipeline regressions': 'success',
                  'Run focused custom patch and producer-consumer gates': 'success',
                  'Set up bounded hosted Docker Buildx': 'success',
                  'Verify hosted worker limits and begin bounded resource observation': 'success',
                  'Prepare OCI directory': 'success',
                  'Build exact candidate once into OCI': 'success',
                  'Inspect all OCI layers and metadata before native smoke or publication': 'failure',
                  'Finish resource observation through export load and native verification': 'success',
                  'Post Build exact candidate once into OCI': 'success',
                  'Post Set up bounded hosted Docker Buildx': 'success'}
              for prior_id, (sha, job_id) in priors.items():
                  prior = next(r for r in runs if r['id'] == prior_id)
                  if not (prior.get('head_sha') == sha and prior.get('status') == 'completed' and
                          prior.get('conclusion') == 'failure'):
                      raise SystemExit('Prior image run differs from its recorded terminal failure')
                  job = public_json('/actions/jobs/' + str(job_id))
                  steps = job.get('steps')
                  if not (job.get('id') == job_id and job.get('run_id') == prior_id and
                          job.get('head_sha') == sha and type(job.get('run_attempt')) is int and
                          job['run_attempt'] == 1 and
                          job.get('name') == 'qualify-and-prepare' and job.get('status') == 'completed' and
                          job.get('conclusion') == 'failure' and isinstance(steps, list)):
                      raise SystemExit('Prior image job differs from its recorded terminal failure')
                  prior_expected = built_expected if prior_id in built_priors else expected
                  if prior_id in private_preflight_priors:
                      prior_expected = {**expected,
                          'Run focused custom patch and producer-consumer gates': 'skipped',
                          'Capture original hosted build metadata for private retention': 'skipped',
                          'Retain private OCI archive': 'skipped'}
                  if prior_id in private_retention_failure_priors:
                      prior_expected = {**built_expected,
                          'Capture original hosted build metadata for private retention': 'success',
                          'Retain private OCI archive': 'failure'}
                  if prior_id in private_retention_success_priors:
                      prior_expected = {**built_expected,
                          'Capture original hosted build metadata for private retention': 'success',
                          'Retain private OCI archive': 'success'}
                  for name, conclusion in prior_expected.items():
                      matching = [s for s in steps if isinstance(s, dict) and s.get('name') == name]
                      if not (len(matching) == 1 and matching[0].get('status') == 'completed' and
                              matching[0].get('conclusion') == conclusion):
                          raise SystemExit('Prior image build or upload outcome changed or is uncertain')
                  if prior_id in built_priors or prior_id in private_preflight_priors:
                      artifacts = public_json('/actions/runs/' + str(prior_id) + '/artifacts?per_page=1')
                      if not (type(artifacts.get('total_count')) is int and artifacts['total_count'] == 0 and
                              artifacts.get('artifacts') == []):
                          raise SystemExit('Prior physical build artifact absence is not established')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              print('image_only_build=' + ('true' if selected else 'false'), file=output)
              print('private_retention=' + ('true' if selected else 'false'), file=output)
              print('private_workflow_sha=' + (approved if selected else ''), file=output)
          PY_IMAGE_ONLY
          python3 tooling/scripts/fork-release/release.py identity \
            --manifest metadata/scripts/fork-release/manifest.json \
            --inventory metadata/scripts/fork-release/patch-inventory.json >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Verify metadata PR seal before a manual candidate build
        if: steps.identity.outputs.review_base_sha != ''
        env:
          BASE_SHA: ${{ steps.identity.outputs.review_base_sha }}
        run: |
          set -euo pipefail
          git -C metadata fetch --no-tags --depth=1 origin "$BASE_SHA"
          TAG='${{ steps.identity.outputs.upstream_tag }}'
          if [[ -n "$TAG" ]]; then
            git -C metadata fetch --no-tags --depth=1 https://github.com/openclaw/openclaw.git "refs/tags/$TAG"
          fi
          HISTORY_COMMITS='${{ steps.identity.outputs.history_commits }}'
          for COMMIT in $HISTORY_COMMITS; do
            if ! git -C metadata cat-file -e "$COMMIT^{commit}" 2>/dev/null; then
              git -C metadata fetch --no-tags --depth=1 origin "$COMMIT"
            fi
          done
          python3 tooling/scripts/fork-release/source_ancestry.py \
            --manifest metadata/scripts/fork-release/manifest.json \
            --inventory metadata/scripts/fork-release/patch-inventory.json --source-dir metadata
          python3 tooling/scripts/fork-release/pr.py seal-offline \
            --manifest metadata/scripts/fork-release/manifest.json --checkout metadata
      - name: Confirm the exact candidate is the current PR head
        if: github.event_name == 'workflow_dispatch'
        env:
          PR_NUMBER: ${{ steps.identity.outputs.review_pr_number }}
          PR_BASE_SHA: ${{ steps.identity.outputs.review_base_sha }}
          CANDIDATE_HEAD_SHA: ${{ inputs.candidate_head_sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          python3 - <<'PY'
          import os
          import sys

          sys.path.insert(0, "tooling/scripts/fork-release")
          from pr import fetch_public_json, need

          pr = fetch_public_json(f"repos/fr-meyer/openclaw/pulls/{os.environ['PR_NUMBER']}")
          need(pr["state"] == "open" and pr["head"]["sha"] == os.environ["CANDIDATE_HEAD_SHA"],
               "candidate PR is closed or its head changed")
          need(pr["base"]["sha"] == os.environ["PR_BASE_SHA"] and pr["base"]["ref"] == "main",
               "candidate PR base changed after sealing")
          need(pr["head"]["repo"]["full_name"] == "fr-meyer/openclaw" and
               pr["head"]["ref"].startswith("candidate/"), "candidate PR is outside fork release lane")
          PY
      - name: Checkout exact candidate and ordered patch ancestry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.identity.outputs.source_sha }}
          path: source
          fetch-depth: 65
          persist-credentials: false
      - name: Setup supported Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.identity.outputs.node_version }}
          package-manager-cache: false
      - name: Verify source and run offline pipeline regressions
        id: source
        run: |
          set -euo pipefail
          TAG='${{ steps.identity.outputs.upstream_tag }}'
          if [[ -n "$TAG" ]]; then
            git -C source fetch --no-tags --depth=1 https://github.com/openclaw/openclaw.git "refs/tags/$TAG"
          fi
          HISTORY_COMMITS='${{ steps.identity.outputs.history_commits }}'
          for COMMIT in $HISTORY_COMMITS; do
            if ! git -C source cat-file -e "$COMMIT^{commit}" 2>/dev/null; then
              git -C source fetch --no-tags --depth=1 origin "$COMMIT"
            fi
          done
          python3 tooling/scripts/fork-release/source_ancestry.py \
            --manifest metadata/scripts/fork-release/manifest.json \
            --inventory metadata/scripts/fork-release/patch-inventory.json --source-dir source
          python3 tooling/scripts/fork-release/preflight.py \
            --manifest metadata/scripts/fork-release/manifest.json \
            --inventory metadata/scripts/fork-release/patch-inventory.json --source-dir source
          if [[ '${{ steps.identity.outputs.image_only_build }}' == true ]]; then
            # This job qualifies an image; GCP database/teardown lifecycle is
            # separate. Keep all hosted/image and source-binding owners here.
            python3 -m unittest discover -s tooling/scripts/fork-release -p 'test_hosted_*.py'
            python3 -m unittest discover -s tooling/scripts/fork-release -p 'test_private_oci_*.py'
            python3 -m unittest discover -s tooling/scripts/fork-release -p 'test_image*.py'
            PYTHONPATH=tooling/scripts/fork-release python3 -m unittest \
              test_preflight test_release test_source_ancestry test_source_tests \
              test_merge_source test_limited_coverage_gate
          else
            python3 -m unittest discover -s tooling/scripts/fork-release -p 'test_*.py'
          fi
          python3 -c 'import json; print("version=" + json.load(open("source/package.json"))["version"])' >> "$GITHUB_OUTPUT"
      - name: Run focused custom patch and producer-consumer gates
        run: |
          set -euo pipefail
          cd source
          corepack enable
          pnpm install --frozen-lockfile
          mapfile -t tests < <(python3 ../tooling/scripts/fork-release/release.py gates \
            --manifest ../metadata/scripts/fork-release/manifest.json \
            --inventory ../metadata/scripts/fork-release/patch-inventory.json)
          if [[ -z "${tests[*]-}" ]]; then
            echo "No source regression gates selected" >&2
            exit 78
          fi
          vitest_tests=()
          native_tests=()
          for test_path in "${tests[@]}"; do
            case "$test_path" in
              *.test.mjs|*.e2e.mjs) native_tests+=("$test_path") ;;
              *) vitest_tests+=("$test_path") ;;
            esac
            # Preserve the older MCP producer's declared native prerequisite.
            if [[ "$test_path" == "src/agents/mcp-http-transport.test.ts" &&
                  " ${tests[*]} " != *" test/mcp-nowistay-sdk-regression.test.mjs "* ]]; then
              native_tests+=(test/mcp-nowistay-sdk-regression.test.mjs)
            fi
          done
          if [[ -n "${vitest_tests[*]-}" ]]; then
            OPENCLAW_VITEST_MAX_WORKERS=2 node scripts/run-vitest.mjs run "${vitest_tests[@]}"
          fi
          if [[ -n "${native_tests[*]-}" ]]; then
            native_args=(--source-root "$PWD")
            if [[ -n "${vitest_tests[*]-}" ]]; then
              for test_path in "${vitest_tests[@]}"; do
                native_args+=(--completed-vitest "$test_path")
              done
            fi
            node ../tooling/scripts/fork-release/native_tests.mjs "${native_args[@]}" -- "${native_tests[@]}"
          fi
      - name: Install reviewed OCI smoke transport
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y skopeo
          skopeo --version | grep -Fx 'skopeo version 1.13.3'
      - name: Set up bounded hosted Docker Buildx
        id: builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.0
          driver: docker-container
          cache-binary: false
          driver-opts: |
            image=moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
            memory=8589934592
            memory-swap=8589934592
            cpu-period=100000
            cpu-quota=400000
      - name: Verify hosted worker limits and begin bounded resource observation
        id: resources
        env:
          BUILDER_NAME: ${{ steps.builder.outputs.name }}
          BUILDER_DRIVER: ${{ steps.builder.outputs.driver }}
          BUILDER_NODES: ${{ steps.builder.outputs.nodes }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
          TOOLING_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 -c 'import os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "fork-hosted-nodes.json").write_text(os.environ["BUILDER_NODES"])'
          python3 tooling/scripts/fork-release/hosted_resources.py start \
            --builder "$BUILDER_NAME" --driver "$BUILDER_DRIVER" --nodes-json "$RUNNER_TEMP/fork-hosted-nodes.json" --state-dir "$RUNNER_TEMP/fork-hosted-observation" \
            --source-sha "$SOURCE_SHA" --tooling-sha "$TOOLING_SHA"
      - name: Prepare OCI directory
        run: mkdir -p "$RUNNER_TEMP/fork-release/oci"
      - name: Build exact candidate once into OCI
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: ${{ format('https://github.com/fr-meyer/openclaw.git?fetch-by-commit=true&checksum={0}#{0}', steps.identity.outputs.source_sha) }}
          platforms: linux/amd64
          # One public source name produces one native provenance Self subject.
          tags: ${{ format('openclaw-source:{0}', steps.identity.outputs.source_sha) }}
          outputs: type=oci,dest=${{ runner.temp }}/fork-release/oci/default,tar=false,compression=gzip,compression-level=1
          build-args: |
            GITHUB_ACTIONS=true
            GIT_COMMIT=${{ steps.identity.outputs.source_sha }}
            OPENCLAW_BUILD_TIMESTAMP=${{ steps.identity.outputs.built_at }}
            OPENCLAW_DOCKER_BUILD_VERSION=${{ steps.source.outputs.version }}
            OPENCLAW_EXTENSIONS=${{ steps.identity.outputs.extensions }}
            OPENCLAW_PARITY_IMAGE=1
            OPENCLAW_DOCKER_BUILD_TSDOWN_MAX_OLD_SPACE_MB=6144
          labels: |
            org.opencontainers.image.revision=${{ steps.identity.outputs.source_sha }}
            org.opencontainers.image.version=${{ steps.source.outputs.version }}
            org.opencontainers.image.created=${{ steps.identity.outputs.built_at }}
          sbom: true
          provenance: mode=max,version=v1
          push: false
      - name: Inspect all OCI layers and metadata before native smoke or publication
        env:
          OCI_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
          TOOLING_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          set --
          if [[ "$SOURCE_SHA" == '30786562e236aab6a924981c62aa61b920132c76' ]]; then
            set -- --public-comparisons tooling/scripts/fork-release/public-member-comparisons-v105-workboard.json --qualify-public-members
          fi
          python3 tooling/scripts/fork-release/hosted_privacy.py \
            --oci-dir "$RUNNER_TEMP/fork-release/oci/default" \
            --expected-index-digest "$OCI_DIGEST" --source-sha "$SOURCE_SHA" \
            --tooling-sha "$TOOLING_SHA" --output "$RUNNER_TEMP/fork-release/privacy.json" "$@"
      - name: Verify OCI bytes and smoke that exact image
        env:
          BUILT_AT: ${{ steps.identity.outputs.built_at }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          BUILDKIT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          node tooling/scripts/fork-release/image.mjs seal \
            metadata/scripts/fork-release/manifest.json \
            metadata/scripts/fork-release/patch-inventory.json source \
            "$RUNNER_TEMP/fork-release/oci/default" "$BUILDKIT_DIGEST" \
            "$RUNNER_TEMP/fork-release/receipt.json"
      - name: Finish resource observation through export load and native verification
        id: resource_finish
        if: always() && steps.resources.outcome == 'success'
        env:
          OCI_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          python3 tooling/scripts/fork-release/hosted_resources.py finish \
            --state-dir "$RUNNER_TEMP/fork-hosted-observation" \
            --index-digest "$OCI_DIGEST" --output "$RUNNER_TEMP/fork-release/resources.json"
      - name: Capture original hosted build metadata for private retention
        id: private_metadata
        if: >-
          ${{ always() && !cancelled() && steps.identity.outputs.private_retention == 'true' &&
              steps.build.outcome == 'success' &&
              (steps.resource_finish.outcome == 'success' || steps.resource_finish.outcome == 'failure') }}
        env:
          ORIGINAL_BUILD_METADATA: ${{ steps.build.outputs.metadata }}
          OCI_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY_PRIVATE_METADATA'
          import json
          import os
          from pathlib import Path

          raw = os.environ['ORIGINAL_BUILD_METADATA'].encode()
          if len(raw) > 2 * 1024 * 1024:
              raise SystemExit('Original build metadata exceeds retention bound')
          metadata = json.loads(raw)
          if not isinstance(metadata, dict) or metadata.get('containerimage.digest') != os.environ['OCI_DIGEST']:
              raise SystemExit('Original build metadata identity differs')
          target = Path(os.environ['RUNNER_TEMP'], 'fork-release/build-metadata.json')
          descriptor = os.open(target, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
          with os.fdopen(descriptor, 'wb') as output:
              output.write(raw)
              output.flush()
              os.fsync(output.fileno())
          PY_PRIVATE_METADATA
      - name: Retain private OCI archive
        if: >-
          ${{ always() && !cancelled() && steps.identity.outputs.private_retention == 'true' &&
              steps.build.outcome == 'success' && steps.private_metadata.outcome == 'success' }}
        uses: ./tooling/.github/actions/retain-private-oci
        with:
          enabled: ${{ steps.identity.outputs.private_retention }}
          approved-workflow-sha: ${{ steps.identity.outputs.private_workflow_sha }}
          source-sha: ${{ steps.identity.outputs.source_sha }}
          source-tree: 2c7d245a5abe5b4ecfd4477f7890f00aaa3deeff
          built-at: ${{ steps.identity.outputs.built_at }}
          manifest: metadata/scripts/fork-release/manifest.json
          inventory: metadata/scripts/fork-release/patch-inventory.json
          build-metadata: ${{ runner.temp }}/fork-release/build-metadata.json
          resources: ${{ runner.temp }}/fork-release/resources.json
          oci-directory: ${{ runner.temp }}/fork-release/oci/default
          output-directory: ${{ runner.temp }}/fork-private-retention
          upload-capability: ${{ secrets.OPENCLAW_PRIVATE_OCI_CAPABILITY }}
      - name: Bind hosted qualification receipts and export decision
        env:
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
          TOOLING_SHA: ${{ github.sha }}
          OCI_DIGEST: ${{ steps.build.outputs.digest }}
          PUBLIC_EXPORT: ${{ github.event_name == 'workflow_dispatch' && inputs.export_public_artifact || false }}
          STORAGE_APPROVED: ${{ github.event_name == 'workflow_dispatch' && inputs.artifact_storage_approved || false }}
        run: |
          set -euo pipefail
          python3 tooling/scripts/fork-release/hosted_export.py \
            --seal "$RUNNER_TEMP/fork-release/receipt.json" \
            --privacy "$RUNNER_TEMP/fork-release/privacy.json" \
            --resources "$RUNNER_TEMP/fork-release/resources.json" \
            --source-sha "$SOURCE_SHA" --tooling-sha "$TOOLING_SHA" --index-digest "$OCI_DIGEST" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --public-export "$PUBLIC_EXPORT" --storage-approved "$STORAGE_APPROVED" \
            --output "$RUNNER_TEMP/fork-release/hosted-qualification.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare and verify the bounded public artifact
        id: bundle
        if: >-
          ${{ github.event_name == 'workflow_dispatch' && inputs.export_public_artifact &&
              inputs.artifact_storage_approved }}
        run: |
          set -euo pipefail
          python3 tooling/scripts/fork-release/hosted_bundle.py prepare \
            --root "$RUNNER_TEMP/fork-release" --output-dir "$RUNNER_TEMP/fork-upload" \
            --output "$RUNNER_TEMP/fork-hosted-bundle.json"
          python3 tooling/scripts/fork-release/hosted_bundle.py verify \
            --receipt "$RUNNER_TEMP/fork-hosted-bundle.json" --output-dir "$RUNNER_TEMP/fork-upload" \
            > "$RUNNER_TEMP/fork-hosted-bundle-verified.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          bundle = json.loads(Path(os.environ["RUNNER_TEMP"], "fork-hosted-bundle-verified.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("path=" + bundle["bundlePath"], file=output)
              print("sha256=" + bundle["sha256"], file=output)
          PY
      - name: Retain the exact tested OCI payload and public receipt
        id: image_artifact
        if: >-
          ${{ github.event_name == 'workflow_dispatch' && inputs.export_public_artifact &&
              inputs.artifact_storage_approved }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # The pinned action streams one file unchanged and uses its basename.
          # The prepared ZIP includes all overhead within the 2 GiB hard limit.
          path: ${{ steps.bundle.outputs.path }}
          archive: false
          overwrite: false
          retention-days: 1
          if-no-files-found: error
      - name: Confirm uploaded bytes match the bounded artifact
        if: steps.image_artifact.outcome == 'success'
        env:
          EXPECTED_SHA256: ${{ steps.bundle.outputs.sha256 }}
          UPLOADED_SHA256: ${{ steps.image_artifact.outputs.artifact-digest }}
        run: |
          python3 - <<'PY'
          import os
          import re

          expected = os.environ["EXPECTED_SHA256"]
          if not re.fullmatch(r"[0-9a-f]{64}", expected) or expected != os.environ["UPLOADED_SHA256"]:
              raise SystemExit("Uploaded artifact digest differs from the bounded local ZIP")
          PY
