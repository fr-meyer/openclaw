name: Fork PR and release qualification

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited, assigned, unassigned]
  push:
    branches:
      - release-pipeline/**
    paths:
      - .github/workflows/fork-release-pipeline.yml
      - scripts/fork-release/**
      - scripts/docker-release-artifacts.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  pr-intake:
    if: >-
      ${{ github.event_name == 'pull_request' && github.repository == 'fr-meyer/openclaw' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (startsWith(github.event.pull_request.head.ref, 'task/') ||
           startsWith(github.event.pull_request.head.ref, 'candidate/')) &&
          (github.event.action != 'edited' || github.event.changes.body != null || github.event.changes.base != null) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted PR contract from exact base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: scripts/fork-release
          persist-credentials: false
      - name: Bind declared owner, dependencies and check to head/base
        env:
          CHECK_RUN_ID: ${{ job.check_run_id }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          python3 trusted/scripts/fork-release/pr.py intake \
            --event "$GITHUB_EVENT_PATH" --output "$RUNNER_TEMP/fork-pr-evidence.json"
          cat "$RUNNER_TEMP/fork-pr-evidence.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain exact PR intake evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fork-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.event.pull_request.base.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fork-pr-evidence.json
          retention-days: 14
          if-no-files-found: error

  release-pr-contracts:
    if: >-
      ${{ github.event_name == 'pull_request' && github.repository == 'fr-meyer/openclaw' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.event.pull_request.head.ref, 'candidate/') &&
          github.event.action != 'assigned' && github.event.action != 'unassigned' &&
          needs.pr-intake.result == 'success' }}
    needs: pr-intake
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout trusted PR contract from exact base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts/fork-release
            .github/workflows/clawsweeper-dispatch.yml
          persist-credentials: false
      - name: Checkout exact candidate PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 66
          persist-credentials: false
      - name: Seal exact PR head, base and changed product diff
        id: seal
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHECK_RUN_ID: ${{ job.check_run_id }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          git -C candidate fetch --no-tags --depth=1 origin "$BASE_SHA"
          python3 trusted/scripts/fork-release/pr.py seal \
            --event "$GITHUB_EVENT_PATH" \
            --manifest candidate/scripts/fork-release/manifest.json \
            --checkout candidate --output "$RUNNER_TEMP/release-pr-evidence.json"
          python3 -c 'import json,os; e=json.load(open(os.environ["RUNNER_TEMP"]+"/release-pr-evidence.json")); print("source_sha="+e["sourceSha"])' >> "$GITHUB_OUTPUT"
      - name: Checkout exact product source and patch ancestry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.seal.outputs.source_sha }}
          path: source
          fetch-depth: 65
          persist-credentials: false
      - name: Verify source, manifest and offline PR regressions
        run: |
          set -euo pipefail
          python3 trusted/scripts/fork-release/release.py source-check \
            --manifest candidate/scripts/fork-release/manifest.json --source-dir source
          python3 -m unittest discover -s trusted/scripts/fork-release -p 'test_*.py'
      - name: Setup supported Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Run focused candidate lifecycle and producer-consumer tests
        run: |
          set -euo pipefail
          cd source
          corepack enable
          pnpm install --frozen-lockfile
          mapfile -t tests < <(python3 ../trusted/scripts/fork-release/release.py gates \
            --manifest ../candidate/scripts/fork-release/manifest.json)
          OPENCLAW_VITEST_MAX_WORKERS=2 node scripts/run-vitest.mjs "${tests[@]}"
      - name: Retain passing exact-head contract evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fork-release-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.event.pull_request.base.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-pr-evidence.json
          retention-days: 14
          if-no-files-found: error

  qualify-and-prepare:
    name: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release-pipeline/contracts/') && 'Focused release contracts' || 'Qualify and prepare OCI' }}
    if: >-
      ${{ github.event_name != 'pull_request' && github.repository == 'fr-meyer/openclaw' &&
          github.ref != 'refs/heads/release-pipeline/source/v2026.9.9' &&
          github.ref != 'refs/heads/release-pipeline/image/v2026.9.9' &&
          (github.ref != 'refs/heads/release-pipeline/contracts/v2026.9.9-native-0e6cd516' ||
           (github.event_name == 'push' && github.actor == 'fr-meyer' && github.run_attempt == 1)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.ref == 'refs/heads/release-pipeline/contracts/v2026.9.9-native-0e6cd516' && 120 || 90 }}
    env:
      NATIVE_VALIDATION: ${{ github.ref == 'refs/heads/release-pipeline/contracts/v2026.9.9-native-0e6cd516' }}
      CONTRACTS_ONLY: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release-pipeline/contracts/') }}
    steps:
      - name: Checkout trusted pipeline tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tooling
          # Seal + at most 64 ordered source patches + source base.
          fetch-depth: 66
          persist-credentials: false
      - name: Resolve exact source identity
        id: identity
        run: |
          set -euo pipefail
          python3 tooling/scripts/fork-release/release.py identity \
            --manifest tooling/scripts/fork-release/manifest.json >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Verify manifest-only PR seal
        if: steps.identity.outputs.review_base_sha != ''
        env:
          BASE_SHA: ${{ steps.identity.outputs.review_base_sha }}
        run: |
          set -euo pipefail
          git -C tooling fetch --no-tags --depth=1 origin "$BASE_SHA"
          python3 tooling/scripts/fork-release/pr.py seal-offline \
            --manifest tooling/scripts/fork-release/manifest.json --checkout tooling
      - name: Checkout exact candidate and ordered patch ancestry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.identity.outputs.source_sha }}
          path: source
          fetch-depth: 65
          persist-credentials: false
      - name: Verify source and run offline pipeline regressions
        id: source
        run: |
          set -euo pipefail
          python3 tooling/scripts/fork-release/release.py source-check \
            --manifest tooling/scripts/fork-release/manifest.json --source-dir source
          if [ "$NATIVE_VALIDATION" = 'true' ]; then
            PYTHONPATH=tooling/scripts/fork-release python3 -m unittest test_release test_ops_gate test_native
          else
            python3 -m unittest discover -s tooling/scripts/fork-release -p 'test_*.py'
          fi
          python3 -c 'import json; print("version=" + json.load(open("source/package.json"))["version"])' >> "$GITHUB_OUTPUT"
      - name: Setup supported Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Run focused custom patch and producer-consumer gates
        if: env.NATIVE_VALIDATION != 'true'
        run: |
          set -euo pipefail
          cd source
          corepack enable
          pnpm install --frozen-lockfile
          mapfile -t tests < <(python3 ../tooling/scripts/fork-release/release.py gates \
            --manifest ../tooling/scripts/fork-release/manifest.json)
          OPENCLAW_VITEST_MAX_WORKERS=2 node scripts/run-vitest.mjs "${tests[@]}"
      - name: Run exact native source validation once
        if: env.NATIVE_VALIDATION == 'true'
        env:
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: python3 tooling/scripts/fork-release/native.py run --source source --tooling tooling
      - name: Seal bounded native evidence on every outcome
        id: native-evidence
        if: always() && env.NATIVE_VALIDATION == 'true'
        env:
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: python3 tooling/scripts/fork-release/native.py finalize --source source --tooling tooling
      - name: Retain native receipts and sanitized bounded logs
        if: always() && env.NATIVE_VALIDATION == 'true' && steps.native-evidence.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fork-native-${{ steps.identity.outputs.source_sha }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fork-native-evidence/
          retention-days: 3
          if-no-files-found: error
      - name: Record contract-only scope
        if: env.CONTRACTS_ONLY == 'true' && env.NATIVE_VALIDATION != 'true'
        run: echo "Focused source and contract gates passed; no OCI image was built." >> "$GITHUB_STEP_SUMMARY"
      - name: Install reviewed OCI smoke transport
        if: env.CONTRACTS_ONLY != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y skopeo
          skopeo --version | grep -Fx 'skopeo version 1.13.3'
      - name: Set up Docker Buildx
        if: env.CONTRACTS_ONLY != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Prepare OCI directory
        if: env.CONTRACTS_ONLY != 'true'
        run: mkdir -p "$RUNNER_TEMP/fork-release/oci"
      - name: Build exact candidate once into OCI
        if: env.CONTRACTS_ONLY != 'true'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: source
          platforms: linux/amd64
          outputs: type=oci,dest=${{ runner.temp }}/fork-release/oci/default,tar=false,compression=gzip,compression-level=1
          build-args: |
            GITHUB_ACTIONS=true
            GIT_COMMIT=${{ steps.identity.outputs.source_sha }}
            OPENCLAW_BUILD_TIMESTAMP=${{ steps.identity.outputs.built_at }}
            OPENCLAW_DOCKER_BUILD_VERSION=${{ steps.source.outputs.version }}
            OPENCLAW_EXTENSIONS=${{ steps.identity.outputs.extensions }}
          labels: |
            org.opencontainers.image.revision=${{ steps.identity.outputs.source_sha }}
            org.opencontainers.image.version=${{ steps.source.outputs.version }}
            org.opencontainers.image.created=${{ steps.identity.outputs.built_at }}
          sbom: true
          provenance: mode=max
          push: false
      - name: Verify OCI bytes and smoke that exact image
        if: env.CONTRACTS_ONLY != 'true'
        env:
          BUILT_AT: ${{ steps.identity.outputs.built_at }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          BUILDKIT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          node tooling/scripts/fork-release/image.mjs seal \
            tooling/scripts/fork-release/manifest.json source \
            "$RUNNER_TEMP/fork-release/oci/default" "$BUILDKIT_DIGEST" \
            "$RUNNER_TEMP/fork-release/receipt.json"
      - name: Retain the exact tested OCI payload and public receipt
        if: env.CONTRACTS_ONLY != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fork-release-${{ steps.identity.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fork-release/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  v99-source:
    name: v2026.9.9 exact source proof
    if: >-
      ${{ github.event_name == 'push' && github.repository == 'fr-meyer/openclaw' &&
          (github.ref == 'refs/heads/release-pipeline/source/v2026.9.9' ||
           github.ref == 'refs/heads/release-pipeline/image/v2026.9.9') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      extensions: ${{ steps.identity.outputs.extensions }}
      parity_image: ${{ steps.identity.outputs.parity_image }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Checkout exact pipeline tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - name: Resolve 9.9 manifest identity
        id: identity
        run: |
          set -euo pipefail
          python3 tooling/scripts/fork-release/release.py identity \
            --manifest tooling/scripts/fork-release/manifests/v2026.9.9.json >> "$GITHUB_OUTPUT"
      - name: Checkout exact 9.9 source and base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.identity.outputs.source_sha }}
          path: source
          fetch-depth: 4
          persist-credentials: false
      - name: Prove source chain and release contracts before install
        id: source
        run: |
          set -euo pipefail
          python3 tooling/scripts/fork-release/release.py source-check \
            --manifest tooling/scripts/fork-release/manifests/v2026.9.9.json --source-dir source
          python3 -m unittest discover -s tooling/scripts/fork-release -p 'test_*.py'
          echo "version=$(python3 -c 'import json; print(json.load(open("source/package.json"))["version"])')" >> "$GITHUB_OUTPUT"
      - name: Setup supported Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Run publisher source plan and changed-owner planner
        run: |
          set -euo pipefail
          cd source
          git fetch --depth=1 https://github.com/openclaw/openclaw.git \
            refs/tags/v2026.9.9:refs/tags/v2026.9.9
          node scripts/docker/package-current-publisher.mjs --plan-image true
          corepack enable
          pnpm install --frozen-lockfile
          node scripts/check-changed.mjs --dry-run \
            --base bcfc88812a35243893585dbeca87ca41b48272ca --head HEAD \
            2>&1 | tee "$RUNNER_TEMP/v99-changed-owner-plan.txt"
          grep -F '[check:changed:dry-run] lanes=' "$RUNNER_TEMP/v99-changed-owner-plan.txt" >> "$GITHUB_STEP_SUMMARY"
          echo "Changed-owner plan: base bcfc88812a35243893585dbeca87ca41b48272ca, head ${{ steps.identity.outputs.source_sha }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Type check and build exact source
        run: |
          set -euo pipefail
          cd source
          pnpm tsgo:test
          pnpm build
      - name: Run focused lifecycle and producer-consumer tests
        run: |
          set -euo pipefail
          cd source
          python3 ../tooling/scripts/fork-release/release.py gates \
            --manifest ../tooling/scripts/fork-release/manifests/v2026.9.9.json --runner vitest \
            > "$RUNNER_TEMP/v99-vitest-gates.txt"
          python3 ../tooling/scripts/fork-release/release.py gates \
            --manifest ../tooling/scripts/fork-release/manifests/v2026.9.9.json --runner node \
            > "$RUNNER_TEMP/v99-node-gates.txt"
          mapfile -t vitest_tests < "$RUNNER_TEMP/v99-vitest-gates.txt"
          mapfile -t node_tests < "$RUNNER_TEMP/v99-node-gates.txt"
          if (( ${#vitest_tests[@]} == 0 || ${#node_tests[@]} == 0 )); then
            echo "Refusing an empty focused test lane" >&2
            exit 1
          fi
          vitest_exit=0
          OPENCLAW_VITEST_MAX_WORKERS=2 node scripts/run-vitest.mjs "${vitest_tests[@]}" || vitest_exit=$?
          node_exit=0
          node --test "${node_tests[@]}" || node_exit=$?
          printf 'Focused Vitest exit: %s; Node exit: %s\n' "$vitest_exit" "$node_exit" >> "$GITHUB_STEP_SUMMARY"
          if (( vitest_exit != 0 || node_exit != 0 )); then
            exit 1
          fi
          echo "Source proof passed for ${{ steps.identity.outputs.source_sha }}. No image was built in this job." >> "$GITHUB_STEP_SUMMARY"

  v99-image:
    name: v2026.9.9 digest-bound OCI proof
    needs: [v99-source]
    if: >-
      ${{ github.event_name == 'push' && github.repository == 'fr-meyer/openclaw' &&
          github.ref == 'refs/heads/release-pipeline/image/v2026.9.9' &&
          needs['v99-source'].result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact pipeline tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - name: Checkout proven source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs['v99-source'].outputs.source_sha }}
          path: source
          fetch-depth: 4
          persist-credentials: false
      - name: Recheck source and manifest before build
        run: |
          set -euo pipefail
          python3 tooling/scripts/fork-release/release.py source-check \
            --manifest tooling/scripts/fork-release/manifests/v2026.9.9.json --source-dir source
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Setup supported Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Install reviewed OCI smoke transport
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y skopeo
          skopeo --version | grep -Fx 'skopeo version 1.13.3'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Prepare OCI directory
        run: mkdir -p "$RUNNER_TEMP/fork-release/oci"
      - name: Build exact source once into OCI
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: source
          platforms: linux/amd64
          outputs: type=oci,dest=${{ runner.temp }}/fork-release/oci/default,tar=false,compression=gzip,compression-level=1
          build-args: |
            GITHUB_ACTIONS=true
            GIT_COMMIT=${{ needs['v99-source'].outputs.source_sha }}
            OPENCLAW_BUILD_TIMESTAMP=${{ env.built_at }}
            OPENCLAW_DOCKER_BUILD_VERSION=${{ needs['v99-source'].outputs.version }}
            OPENCLAW_EXTENSIONS=${{ needs['v99-source'].outputs.extensions }}
            OPENCLAW_PARITY_IMAGE=${{ needs['v99-source'].outputs.parity_image }}
          labels: |
            org.opencontainers.image.revision=${{ needs['v99-source'].outputs.source_sha }}
            org.opencontainers.image.version=${{ needs['v99-source'].outputs.version }}
            org.opencontainers.image.created=${{ env.built_at }}
          sbom: true
          provenance: mode=max
          push: false
      - name: Seal and smoke exact OCI image
        env:
          BUILT_AT: ${{ env.built_at }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          BUILDKIT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          node tooling/scripts/fork-release/image.mjs seal \
            tooling/scripts/fork-release/manifests/v2026.9.9.json source \
            "$RUNNER_TEMP/fork-release/oci/default" "$BUILDKIT_DIGEST" \
            "$RUNNER_TEMP/fork-release/receipt.json"
      - name: Bound public artifact bytes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "fork-release"
          total = 0
          for directory, dirs, files in os.walk(root, followlinks=False):
              for name in dirs + files:
                  path = Path(directory) / name
                  if path.is_symlink():
                      raise SystemExit("OCI artifact contains a symlink")
                  if path.is_file():
                      total += path.stat().st_size
                  elif not path.is_dir():
                      raise SystemExit("OCI artifact contains a special file")
          if total > 4 * 1024**3:
              raise SystemExit(f"OCI artifact exceeds 4 GiB cap: {total} bytes")
          print(f"OCI artifact payload: {total} bytes, retention 3 days")
          PY
      - name: Retain tested OCI payload and public receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fork-release-${{ needs['v99-source'].outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fork-release/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
