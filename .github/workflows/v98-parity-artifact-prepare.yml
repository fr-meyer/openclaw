name: V98 Combined Source and Artifact Preparation
run-name: V98 combined fe1b334f ${{ github.run_id }}

# First-attempt-only jobs require fresh exact commit/run-number approval.
# New image bindings need a separate reviewed commit before runtime admission.
on:
  push:
    branches: [candidate/v2026.9.8-runtime-admission-5]
    paths:
      - .github/workflows/v98-parity-artifact-prepare.yml
      - scripts/proofs/v98-parity/contract.json
      - scripts/proofs/v98-parity/nowistay-focused-tsconfig.json

permissions:
  contents: read

concurrency:
  group: v98-parity-artifact-prepare
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TARGET_SHA: fe1b334f74f1e43efc22f91c1c3738e59c52519c
  TARGET_TREE: 5da503ec4fdd8242a5caf71ae8bfc1621c8996f3

jobs:
  source-checks:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'fr-meyer/openclaw' &&
      github.ref == 'refs/heads/candidate/v2026.9.8-runtime-admission-5' &&
      github.sha == vars.V98_BUILD_APPROVED_COMMIT &&
      format('{0}', github.run_number) == vars.V98_BUILD_APPROVED_RUN_NUMBER &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact reviewed combined source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fe1b334f74f1e43efc22f91c1c3738e59c52519c
          fetch-depth: 1
          persist-credentials: false

      - name: Check source attribution before setup
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          test -z "$(git status --porcelain=v1)"

      - name: Prepare repository toolchain and maintained semantic containment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.18.0"
          semantic-checks: "true"
          install-bun: "false"
          cache-mode: "off"
          frozen-lockfile: "true"

      - name: Checkout exact build tooling config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .v98-tooling
          sparse-checkout: |
            scripts/proofs/v98-parity/nowistay-focused-tsconfig.json
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - name: Run focused strict source and complete MCP HTTP lifecycle checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .v98-tooling rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C .v98-tooling status --porcelain=v1)"
          out="$RUNNER_TEMP/v98-focused-ci"
          mkdir -m 700 "$out"
          {
            node scripts/run-tsgo.mjs -p .v98-tooling/scripts/proofs/v98-parity/nowistay-focused-tsconfig.json --noEmit
            node scripts/run-oxlint.mjs --tsconfig config/tsconfig/oxlint.core.json --deny-warnings \
              src/agents/mcp-http-tool-schema-compatibility.ts src/agents/mcp-http-transport.ts
            node scripts/run-oxlint.mjs --tsconfig test/tsconfig/tsconfig.test.root.json --deny-warnings \
              test/mcp-nowistay-schema-compatibility.test.mjs test/mcp-nowistay-sdk-regression.test.mjs
            pnpm exec oxfmt --check \
              src/agents/mcp-http-tool-schema-compatibility.ts src/agents/mcp-http-transport.ts \
              test/mcp-nowistay-schema-compatibility.test.mjs test/mcp-nowistay-sdk-regression.test.mjs \
              test/fixtures/nowistay-list-properties-output-schema.json
            node --permission --allow-fs-read="$GITHUB_WORKSPACE" --test-isolation=none --test \
              test/mcp-nowistay-schema-compatibility.test.mjs test/mcp-nowistay-sdk-regression.test.mjs
            pnpm test src/agents/mcp-http-transport.test.ts --maxWorkers=1
            git diff --exit-code
            git diff --cached --exit-code
          } 2>&1 | tee "$out/checks.log"
          test "$(wc -c < "$out/checks.log")" -le 8388608
          # Exactly one uploaded artifact belongs to the producer run. Focused
          # CI results are retained in its exact job/step logs and collected
          # read-only locally before any later admission.

  prepare:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'fr-meyer/openclaw' &&
      github.ref == 'refs/heads/candidate/v2026.9.8-runtime-admission-5' &&
      github.sha == vars.V98_BUILD_APPROVED_COMMIT &&
      format('{0}', github.run_number) == vars.V98_BUILD_APPROVED_RUN_NUMBER &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact reviewed combined source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fe1b334f74f1e43efc22f91c1c3738e59c52519c
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout separate proposal tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tooling
          sparse-checkout: |
            .github/workflows/v98-parity-artifact-prepare.yml
            scripts/proofs/v98-parity
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check tooling and qualified source attribution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C source rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          test -z "$(git -C source status --porcelain=v1)"
          test "$(git -C tooling rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C tooling status --porcelain=v1)"
          export V98_QUALIFIED_SOURCE="$GITHUB_WORKSPACE/source"
          python3 -B -m unittest discover -s tooling/scripts/proofs/v98-parity -p 'test_*.py'
          # Use the repository's reviewed actionlint pin; no local acquisition.
          export GOBIN="$RUNNER_TEMP/v98-actionlint"
          go install github.com/rhysd/actionlint/cmd/actionlint@011a6d15e749bb3f2d771eed9c7aa0e7e3e10ee7
          "$GOBIN/actionlint" tooling/.github/workflows/v98-parity-artifact-prepare.yml

      - name: Build canonical image and retain its exact bytes
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/v98-parity-artifacts"
          mkdir -m 700 "$out"
          image_tag="openclaw-v98-proof:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export V98_IMAGE_TAG="$image_tag"
          V98_BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export V98_BUILD_TIMESTAMP
          printf '%s\n' "V98_IMAGE_TAG=$image_tag" >> "$GITHUB_ENV"
          python3 tooling/scripts/proofs/v98-parity/collect-artifacts.py preflight source "$out"
          docker version > "$out/docker-version.txt"
          # This stage uses hosted build downloads. No credentials, secrets,
          # registry publication, default-entrypoint start or private state input.
          docker build --platform linux/amd64 --file source/Dockerfile \
            --iidfile "$out/image-id.txt" \
            --build-arg "GIT_COMMIT=$TARGET_SHA" \
            --build-arg OPENCLAW_PARITY_IMAGE=1 \
            --build-arg OPENCLAW_EXTENSIONS=workboard \
            --build-arg OPENCLAW_DOCKER_BUILD_SKIP_DTS=0 \
            --build-arg GITHUB_ACTIONS=true \
            --build-arg "OPENCLAW_BUILD_TIMESTAMP=$V98_BUILD_TIMESTAMP" \
            --label "org.opencontainers.image.revision=$TARGET_SHA" \
            --label "org.opencontainers.image.source=https://github.com/fr-meyer/openclaw" \
            --tag "$image_tag" source 2>&1 | tee "$out/build.log"
          image_id="$(cat "$out/image-id.txt")"
          docker image inspect "$image_id" > "$out/image-inspect.json"
          docker save "$image_id" | gzip -1 > "$out/image.tar.gz"
          container_name="v98-artifact-export-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' "V98_EXPORT_CONTAINER=$container_name" >> "$GITHUB_ENV"
          # Never start this container. Export reads immutable image content.
          container_id="$(docker create --name "$container_name" --network none --read-only --cap-drop ALL --entrypoint /bin/true "$image_id")"
          docker export "$container_id" > "$out/filesystem.tar"
          docker rm "$container_id"
          python3 tooling/scripts/proofs/v98-parity/collect-artifacts.py seal source "$out"

      - name: Remove only owned export container
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${V98_EXPORT_CONTAINER:-}" ]] && docker container inspect "$V98_EXPORT_CONTAINER" >/dev/null 2>&1; then
            docker rm "$V98_EXPORT_CONTAINER"
          fi

      - name: Stage only admitted bytes and bounded failure evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 tooling/scripts/proofs/v98-parity/collect-artifacts.py retain \
            "$RUNNER_TEMP/v98-parity-artifacts" "$RUNNER_TEMP/v98-parity-upload"

      - name: Retain admitted build bytes and failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: v98-parity-build-fe1b334f-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v98-parity-upload/
          if-no-files-found: error
          retention-days: 7
