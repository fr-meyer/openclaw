name: Future v108 source validation
run-name: future-v108-source-validation-20261027

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

# One campaign, including corrections. Queued duplicates fail admission.
concurrency:
  group: future-v108-source-validation-20261027
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  admission:
    if: >-
      ${{ github.actor == 'fr-meyer' && github.repository == 'fr-meyer/openclaw' && github.event.repository.private == false &&
          github.event.pull_request.number == 28 && github.event.pull_request.draft == true &&
          github.event.pull_request.head.repo.full_name == 'fr-meyer/openclaw' &&
          github.event.pull_request.head.ref == 'task/v107-source-binding' &&
          github.event.pull_request.base.ref == 'release-pipeline/v105-image-only-20261024' &&
          github.event.pull_request.base.sha == 'a65f70c5dad17b39bc3ee26ba92cde6d00bfb259' &&
          github.run_attempt == 1 }}
    name: admission
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.admit.outputs.matrix }}
      deadline_epoch: ${{ steps.admit.outputs.deadline_epoch }}
    steps:
      - name: Require full admission clock before either checkout
        id: admission-clock
        run: |
          /usr/bin/python3 -I -B - <<'PY'
          import math, os, time
          from datetime import datetime, timezone
          deadline = datetime(2026, 10, 30, 0, 3, 19, tzinfo=timezone.utc).timestamp()
          now = time.time()
          if not math.isfinite(now) or now < 0 or now + 30 * 60 > deadline:
              raise SystemExit("v6.workflow.admission_deadline_refused")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("started_epoch=" + str(int(now)) + "\n")
          PY
      - name: Checkout reviewed pipeline head and complete ancestry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fr-meyer/openclaw
          ref: ${{ github.event.pull_request.head.sha }}
          path: pipeline
          fetch-depth: 0
          persist-credentials: false
      - name: Bound product checkout by the same admission clock
        id: checkout-budget
        env:
          SOURCE_ADMISSION_STARTED_EPOCH: ${{ steps.admission-clock.outputs.started_epoch }}
        run: >-
          python3 pipeline/scripts/fork-release/source_validation_v108.py checkout-budget
          --pipeline-dir "$GITHUB_WORKSPACE/pipeline"
      - name: Checkout frozen product source
        timeout-minutes: ${{ fromJSON(steps.checkout-budget.outputs.checkout_minutes) }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fr-meyer/openclaw
          ref: 76522eaa2dd93a4933b5c87f7451eab1d458f8be
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Admit exact campaign and source with read-only public metadata
        id: admit
        env:
          GH_SOURCE_READ_TOKEN: ${{ github.token }}
          SOURCE_ADMISSION_STARTED_EPOCH: ${{ steps.admission-clock.outputs.started_epoch }}
        run: >-
          python3 pipeline/scripts/fork-release/source_validation_v108.py admit
          --pipeline-dir "$GITHUB_WORKSPACE/pipeline" --source-dir "$GITHUB_WORKSPACE/source"

  source:
    needs: admission
    if: ${{ github.actor == 'fr-meyer' && needs.admission.result == 'success' }}
    name: source (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.minutes }}
    permissions:
      contents: read
    env:
      SOURCE_PROFILE: ${{ matrix.profile }}
      SOURCE_DEADLINE_EPOCH: ${{ needs.admission.outputs.deadline_epoch }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.admission.outputs.matrix) }}
    steps:
      - name: Require full profile and final clocks before either checkout
        id: source-clock
        env:
          SOURCE_CLOCK_MINUTES: ${{ matrix.minutes }}
        run: |
          /usr/bin/python3 -I -B - <<'PY'
          import math, os, time
          from datetime import datetime, timezone
          profiles = ("dependency", "types-production", "types-tests", "types-scripts", "workboard-1", "workboard-2", "models-1", "models-2", "sqlite", "doctor-1", "doctor-2", "doctor-3", "memory", "pipeline-contracts", "compatibility")
          caps = dict(zip(profiles, (60, 90, 90, 90, 60, 60, 60, 60, 60, 90, 75, 75, 60, 45, 60)))
          profile = os.environ.get("SOURCE_PROFILE")
          if profile not in caps or os.environ.get("SOURCE_CLOCK_MINUTES") != str(caps[profile]):
              raise SystemExit("v6.workflow.profile_cap_refused")
          deadline = datetime(2026, 10, 30, 0, 3, 19, tzinfo=timezone.utc).timestamp()
          if os.environ.get("SOURCE_DEADLINE_EPOCH") != str(int(deadline)):
              raise SystemExit("v6.workflow.profile_deadline_binding_refused")
          now = time.time()
          if not math.isfinite(now) or now < 0 or now + (caps[profile] + 10) * 60 > deadline:
              raise SystemExit("v6.workflow.profile_deadline_refused")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("started_epoch=" + str(int(now)) + "\n")
          PY
      - name: Checkout reviewed pipeline head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fr-meyer/openclaw
          ref: ${{ github.event.pull_request.head.sha }}
          path: pipeline
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout frozen product source
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fr-meyer/openclaw
          ref: 76522eaa2dd93a4933b5c87f7451eab1d458f8be
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Setup fixed supported Node runtime without a cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Verify complete public source closure through maintained preflight
        env:
          SOURCE_JOB_STARTED_EPOCH: ${{ steps.source-clock.outputs.started_epoch }}
        run: >-
          python3 pipeline/scripts/fork-release/source_validation_v108.py fetch-closure
          --pipeline-dir "$GITHUB_WORKSPACE/pipeline" --source-dir "$GITHUB_WORKSPACE/source"
      - name: Run named source profile with synthetic state and credential-free environment
        env:
          SOURCE_JOB_STARTED_EPOCH: ${{ steps.source-clock.outputs.started_epoch }}
        run: >-
          python3 pipeline/scripts/fork-release/source_validation_v108.py run
          --pipeline-dir "$GITHUB_WORKSPACE/pipeline" --source-dir "$GITHUB_WORKSPACE/source"
          --profile "$SOURCE_PROFILE"

  final:
    if: ${{ always() && github.actor == 'fr-meyer' && needs.admission.result == 'success' }}
    needs: [admission, source]
    name: final
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require full final clock before checkout
        run: |
          /usr/bin/python3 -I -B - <<'PY'
          import math, time
          from datetime import datetime, timezone
          deadline = datetime(2026, 10, 30, 0, 3, 19, tzinfo=timezone.utc).timestamp()
          now = time.time()
          if not math.isfinite(now) or now < 0 or now + 10 * 60 > deadline:
              raise SystemExit("v6.workflow.final_deadline_refused")
          PY
      - name: Checkout reviewed pipeline head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fr-meyer/openclaw
          ref: ${{ github.event.pull_request.head.sha }}
          path: pipeline
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github/workflows/future-v108-source-validation.yml
            scripts/fork-release
          persist-credentials: false
      - name: Record bounded source-only result in logs and job summary
        env:
          SOURCE_ADMISSION_RESULT: ${{ needs.admission.result }}
          SOURCE_MATRIX_RESULT: ${{ needs.source.result }}
        run: >-
          python3 pipeline/scripts/fork-release/source_validation_v108.py finalize
          --pipeline-dir "$GITHUB_WORKSPACE/pipeline"

# No artifact upload or cache route. The owner captures allowlisted summaries
# within one day; total retained diagnostic evidence is limited to 64 MiB.
# Normal source postinstall and maintained test-owner qaRuntime/worker/facade
# compilation use ephemeral job storage and remain inside these timeouts.
# No image, registry, cloud, deployment or production approval is produced.
