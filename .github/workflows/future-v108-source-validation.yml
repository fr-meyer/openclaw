name: Future v108 source validation
run-name: future-v108-npm-lock-preparation-20261029

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: future-v108-source-validation-20261027
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lock-preparation:
    if: >-
      ${{ github.repository == 'fr-meyer/openclaw' && github.event.repository.private == false &&
          github.event.pull_request.number == 28 && github.event.pull_request.draft == true &&
          github.event.pull_request.head.repo.full_name == 'fr-meyer/openclaw' &&
          github.event.pull_request.head.ref == 'task/v107-source-binding' &&
          github.event.pull_request.base.ref == 'release-pipeline/v105-image-only-20261024' &&
          github.event.pull_request.base.sha == 'a65f70c5dad17b39bc3ee26ba92cde6d00bfb259' &&
          github.actor == 'fr-meyer' && github.run_attempt == 1 }}
    name: lock-preparation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Observe the shared45-minute job clock before checkouts
        id: clock
        run: |
          /usr/bin/python3 -I -B - <<'PY'
          from datetime import datetime, timezone
          import os
          import time
          started = time.time()
          deadline = datetime(2026, 10, 30, 0, 3, 19, tzinfo=timezone.utc).timestamp()
          if not started + 45 * 60 <= deadline:
              raise SystemExit("npm lock preparation exceeds approved deadline")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("started_epoch=" + str(int(started)) + "\n")
          PY
      - name: Checkout exact reviewed pipeline with its immediate parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fr-meyer/openclaw
          ref: ${{ github.event.pull_request.head.sha }}
          path: pipeline
          fetch-depth: 2
          persist-credentials: false
      - name: Checkout exact immutable sourceB
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fr-meyer/openclaw
          ref: 84d9bd1c618708e9d5798a730d473ddecf99297a
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Admit exact once-only lock preparation with read-only metadata
        id: admission
        env:
          GH_SOURCE_READ_TOKEN: ${{ github.token }}
          NPM_LOCK_STARTED_EPOCH: ${{ steps.clock.outputs.started_epoch }}
        run: /usr/bin/python3 -I -B pipeline/scripts/fork-release/npm_lock_prepare_v108.py admit
      - name: Setup pinned supported Node without dependency cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Derive only the approved npm lock through the maintained resolver
        id: derivation
        env:
          NPM_LOCK_STARTED_EPOCH: ${{ steps.clock.outputs.started_epoch }}
          NPM_LOCK_ADMISSION_SHA256: ${{ steps.admission.outputs.admission_sha256 }}
        run: >-
          /usr/bin/python3 -I -B pipeline/scripts/fork-release/npm_lock_prepare_v108.py derive
          --admission-sha256 "$NPM_LOCK_ADMISSION_SHA256"
      - name: Retain only bounded public lock derivation files
        if: ${{ always() && steps.derivation.outputs.artifact_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: v108-npm-lock-preparation
          path: |
            ${{ runner.temp }}/v108-npm-lock-output-${{ github.run_id }}/pnpm-lock.yaml
            ${{ runner.temp }}/v108-npm-lock-output-${{ github.run_id }}/npm-lock.diff
            ${{ runner.temp }}/v108-npm-lock-output-${{ github.run_id }}/generation.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 6

# This one fixed45-minute job includes both checkouts, bootstrap, derivation,
# artifact transfer and post-actions. Derivation is not candidate qualification.
# Only public source/lock metadata is uploaded (three fixed entries, <=2MiB).
# No cache, image, registry publication, cloud, private data or deployment route.
