name: Compatibility diagnostics qualification
run-name: Compatibility diagnostics ${{ inputs.qualification_mode }} ${{ inputs.expected_sha }}

on:
  workflow_dispatch:
    inputs:
      expected_workflow_sha:
        description: Exact reviewed workflow commit
        required: true
        type: string
      expected_sha:
        description: Exact approved source commit
        required: true
        type: string
      expected_tree:
        description: Exact approved source tree
        required: true
        type: string
      qualification_mode:
        description: Candidate or conditional unchanged baseline
        required: true
        default: candidate
        type: choice
        options:
          - candidate
          - baseline

permissions:
  contents: read

concurrency:
  group: compatibility-diagnostics-${{ inputs.expected_sha }}
  cancel-in-progress: false

jobs:
  qualify:
    if: ${{ github.repository == 'fr-meyer/openclaw' && github.ref == 'refs/heads/qualification/durable-transcript-20261008' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_workflow_sha }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      EXPECTED_TREE: ${{ inputs.expected_tree }}
      QUALIFICATION_MODE: ${{ inputs.qualification_mode }}
      OPENCLAW_TSGO_TIMEOUT_MS: "600000"
      OPENCLAW_VITEST_MAX_WORKERS: "1"
    steps:
      - name: Validate immutable admission
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_WORKFLOW_SHA" ]]
          case "$QUALIFICATION_MODE" in
            candidate) [[ "$EXPECTED_SHA" == "$EXPECTED_WORKFLOW_SHA" ]] ;;
            baseline)
              [[ "$EXPECTED_SHA" == "834c1b50916f95c2f0458629c2748381524670c8" ]]
              [[ "$EXPECTED_TREE" == "91f926e71ba7c57a22bb4e85dc5de935d021c496" ]]
              ;;
            *) exit 1 ;;
          esac
      - name: Checkout exact approved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify source and runner capacity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          [[ "$(git rev-parse 'HEAD^{tree}')" == "$EXPECTED_TREE" ]]
          available_kib=$(df -Pk . | awk 'NR==2 {print $4}')
          available_memory_kib=$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)
          available_cpus=$(nproc)
          printf 'freeDiskKiB=%s availableMemoryKiB=%s availableCPUs=%s\n' "$available_kib" "$available_memory_kib" "$available_cpus"
          if (( available_kib < 10485760 || available_memory_kib < 13631488 || available_cpus < 4 )); then
            echo 'Insufficient standard runner capacity; stop without cleanup or larger-runner allocation.' >&2
            exit 1
          fi
      - name: Verify exact reviewed candidate delta
        if: ${{ inputs.qualification_mode == 'candidate' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD^)" == "834c1b50916f95c2f0458629c2748381524670c8" ]]
          python3 - <<'PYVERIFY'
          import subprocess
          expected = {".github/workflows/ci-check-testbox.yml", "scripts/plugin-boundary-report.ts", "test/scripts/plugin-boundary-report.test.ts"}
          actual = set(subprocess.check_output(["git", "diff", "--name-only", "HEAD^", "HEAD"], text=True).splitlines())
          assert actual == expected, (sorted(actual - expected), sorted(expected - actual))
          PYVERIFY
          sha256sum --check <<'SHA256'
          88276447fc6607192dc21626902a86f4e27d793ff428f78019861dab5322ac71  scripts/plugin-boundary-report.ts
          6dadf8d6eb11790074e8450ca1c0a9b4d4ec35fc47e712898edc1f8ce9572264  test/scripts/plugin-boundary-report.test.ts
          SHA256
      - name: Setup exact Node through the existing Node-only owner
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          source .github/actions/setup-pnpm-store-cache/ensure-node.sh
          openclaw_ensure_node 24.18.0
          [[ "$(node -p 'process.versions.node')" == '24.18.0' ]]
      - name: Install exact checkout-owned dependencies
        id: install
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          node scripts/pnpm.mjs --setup
          node scripts/pnpm.mjs install --frozen-lockfile --store-dir .local/qualification-pnpm-store
          [[ "$(node scripts/pnpm.mjs --version)" == "12.4.2" ]]
          node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync("package.json")); const t=JSON.parse(fs.readFileSync("node_modules/typescript/package.json")); if(t.version!==p.devDependencies.typescript) throw new Error("Compiler pin mismatch"); console.log(JSON.stringify({node:process.version,typescript:t.version,sourceTree:process.env.EXPECTED_TREE}));'
      - name: Complete scripts owner types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 10
        run: >-
          node scripts/pnpm.mjs exec node scripts/run-tsgo.mjs -p tsconfig.scripts.json --incremental --tsBuildInfoFile .artifacts/tsgo-cache/scripts.tsbuildinfo
      - name: Complete root test owner types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 10
        run: >-
          node scripts/pnpm.mjs exec node scripts/run-tsgo.mjs -p test/tsconfig/tsconfig.test.root.json --incremental --tsBuildInfoFile .artifacts/tsgo-cache/test-root.tsbuildinfo
      - name: Native diagnostic report regressions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 5
        run: >-
          node scripts/pnpm.mjs exec node scripts/run-vitest.mjs run --configLoader runner --config test/vitest/vitest.tooling.config.ts --passWithNoTests=false test/scripts/plugin-boundary-report.test.ts
      - name: Canonical workflow policy
        if: ${{ !cancelled() && steps.install.outcome == 'success' && inputs.qualification_mode == 'candidate' }}
        timeout-minutes: 5
        run: node scripts/pnpm.mjs check:workflows
      - name: Candidate changed checks
        if: ${{ !cancelled() && steps.install.outcome == 'success' && inputs.qualification_mode == 'candidate' }}
        timeout-minutes: 10
        run: >-
          node scripts/pnpm.mjs exec node scripts/check-changed.mjs --base 834c1b50916f95c2f0458629c2748381524670c8 -- .github/workflows/ci-check-testbox.yml scripts/plugin-boundary-report.ts test/scripts/plugin-boundary-report.test.ts
      - name: Baseline compatibility gate
        if: ${{ !cancelled() && steps.install.outcome == 'success' && inputs.qualification_mode == 'baseline' }}
        timeout-minutes: 5
        run: node scripts/pnpm.mjs plugins:boundary-report:ci
