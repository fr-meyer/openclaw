          a3b1ea196d8f433373613ab8fb842acb052f7a77b26519e90e517d7fe9af5307  src/gateway/session-transcript-preview.ts
          05ab3ead4d9aa1196b96a167ba1c797eea942326017b9303df9f52a30975caca  src/gateway/session-transcript-title-reader.ts
          3816cf415f6337439ad2dc3c56730a7982f3a6efc31770aa67c50212528b4d76  src/state/agent-deletion-cleanup.ts
          0285b8a8253835732a80d45581724b82b430680ae7c253dd949beb3f692f9488  src/state/openclaw-agent-db-resources.close-wait.test.ts
          700efad5abfbd713bd60ae53212ae6780f453e7255e9d93bbbacb2f4de3407c7  src/state/openclaw-agent-db-resources.ts
          15e5d5321d543cb8f5fa606c38663b81c8a9d65ebe5fb16efbb65e96053b2a6a  src/state/openclaw-agent-execution-contract.ts
          d9bdd0bb6f5abe5c4dedb1fc06c6918cb5c6246495d6192e5c4fffa2afce7adc  src/state/openclaw-agent-execution.worker.ts
          SHA256
      - name: Setup exact Node through the existing Node-only owner
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          source .github/actions/setup-pnpm-store-cache/ensure-node.sh
          openclaw_ensure_node 24.18.0
          [[ "$(node -p 'process.versions.node')" == '24.18.0' ]]
      - name: Install exact checkout-owned dependencies
        id: install
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          node scripts/pnpm.mjs --setup
          node scripts/pnpm.mjs install --frozen-lockfile --store-dir .local/qualification-pnpm-store
          [[ "$(node scripts/pnpm.mjs --version)" == "12.4.2" ]]
          node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync("package.json")); const t=JSON.parse(fs.readFileSync("node_modules/typescript/package.json")); if(t.version!==p.devDependencies.typescript) throw new Error("Compiler pin mismatch"); console.log(JSON.stringify({node:process.version,typescript:t.version,sourceTree:process.env.EXPECTED_TREE}));'
      - name: Core production types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 10
        run: >-
          node scripts/pnpm.mjs exec node scripts/run-tsgo.mjs -p tsconfig.core.json --incremental --tsBuildInfoFile .artifacts/tsgo-cache/core.tsbuildinfo
      - name: Complete agents-sessions test owner types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 10
        run: >-
          node scripts/pnpm.mjs exec node scripts/run-tsgo-core-test-shards.mjs --ci-graphs-json '["core-test-agents-sessions"]'
      - name: Complete state-logging test owner types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 10
        run: >-
          node scripts/pnpm.mjs exec node scripts/run-tsgo-core-test-shards.mjs --ci-graphs-json '["core-test-state-logging"]'
      - name: Canonical typed runtime and SDK build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 20
        run: >-
          node scripts/pnpm.mjs build:strict-smoke
      - name: Native entry, read, writer, custody and close-fence runtime proofs
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 10
        run: >-
          node scripts/pnpm.mjs exec node scripts/run-vitest.mjs run --configLoader runner src/config/sessions/session-accessor.sqlite-entry-admission-worker.test.ts src/config/sessions/session-transcript-reconcile-reader.test.ts src/config/sessions/session-transcript-reconcile-reader.worker.test.ts src/config/sessions/session-transcript-reconcile-writer.test.ts src/config/sessions/session-transcript-reconcile.custody-control.test.ts src/config/sessions/session-transcript-reconcile.entry-worker.test.ts src/config/sessions/session-transcript-worker-runtime.imports.test.ts src/state/openclaw-agent-db-resources.close-wait.test.ts
      - name: All reviewed source changed checks
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 10
        run: >-
          node scripts/pnpm.mjs exec node scripts/check-changed.mjs --base c34e90e1ac1d380e06204f2182b6adb7dba59ae9 -- src/config/sessions/session-accessor.sqlite-entry-admission-worker.test.ts src/config/sessions/session-accessor.sqlite-entry-admission-worker.ts src/config/sessions/session-accessor.sqlite-entry-admission.ts src/config/sessions/session-accessor.sqlite-page-reclamation.ts src/config/sessions/session-history-eviction.ts src/config/sessions/session-transcript-reconcile-custody.ts src/config/sessions/session-transcript-reconcile-read-kernel.ts src/config/sessions/session-transcript-reconcile-reader.test.ts src/config/sessions/session-transcript-reconcile-reader.ts src/config/sessions/session-transcript-reconcile-reader.worker.test.ts src/config/sessions/session-transcript-reconcile-readiness.ts src/config/sessions/session-transcript-reconcile-write-contract.ts src/config/sessions/session-transcript-reconcile-write-kernel.ts src/config/sessions/session-transcript-reconcile-writer.test.ts src/config/sessions/session-transcript-reconcile-writer.ts src/config/sessions/session-transcript-reconcile.custody-control.test.ts src/config/sessions/session-transcript-reconcile.dirty-peer.test-support.mjs src/config/sessions/session-transcript-reconcile.entry-worker.test.ts src/config/sessions/session-transcript-reconcile.ts src/config/sessions/session-transcript-worker-readers.ts src/config/sessions/session-transcript-worker-runtime.imports.test.ts src/config/sessions/session-transcript-worker-runtime.ts src/config/sessions/session-transcript-worker.types.ts src/config/sessions/session-transcript.worker.ts src/gateway/session-transcript-preview.ts src/gateway/session-transcript-title-reader.ts src/state/agent-deletion-cleanup.ts src/state/openclaw-agent-db-resources.close-wait.test.ts src/state/openclaw-agent-db-resources.ts src/state/openclaw-agent-execution-contract.ts src/state/openclaw-agent-execution.worker.ts
