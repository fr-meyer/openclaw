name: Durable transcript worker qualification

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact approved qualification commit
        required: true
        type: string
      expected_tree:
        description: Exact approved qualification tree
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: durable-transcript-qualification-${{ inputs.expected_sha }}
  cancel-in-progress: false

jobs:
  qualify:
    if: ${{ github.repository == 'fr-meyer/openclaw' && github.ref == 'refs/heads/qualification/durable-transcript-20261008' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      EXPECTED_TREE: ${{ inputs.expected_tree }}
      OPENCLAW_TSGO_TIMEOUT_MS: "600000"
      OPENCLAW_TSDOWN_TIMEOUT_MS: "900000"
      OPENCLAW_VITEST_MAX_WORKERS: "1"
    steps:
      - name: Validate immutable admission
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_SHA" ]]
      - name: Checkout exact approved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 3
          persist-credentials: false
      - name: Verify source and runner capacity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          [[ "$(git rev-parse 'HEAD^{tree}')" == "$EXPECTED_TREE" ]]
          available_kib=$(df -Pk . | awk 'NR==2 {print $4}')
          available_memory_kib=$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)
          available_cpus=$(nproc)
          printf 'freeDiskKiB=%s availableMemoryKiB=%s availableCPUs=%s\n' "$available_kib" "$available_memory_kib" "$available_cpus"
          if (( available_kib < 10485760 || available_memory_kib < 13631488 || available_cpus < 4 )); then
            echo 'Insufficient standard runner capacity; stop without cleanup or larger-runner allocation.' >&2
            exit 1
          fi
      - name: Verify exact reviewed source delta
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD^)" == "b44f7c248a56cbca9348af4ab39868e1b4773a6e" ]]
          [[ "$(git rev-parse HEAD^^)" == "c34e90e1ac1d380e06204f2182b6adb7dba59ae9" ]]
          python3 - <<'PYVERIFY'
          import json, subprocess
          expected = set([".github/workflows/ci-check-testbox.yml", "src/config/sessions/session-accessor.sqlite-entry-admission-worker.test.ts", "src/config/sessions/session-accessor.sqlite-entry-admission-worker.ts", "src/config/sessions/session-accessor.sqlite-entry-admission.ts", "src/config/sessions/session-accessor.sqlite-page-reclamation.ts", "src/config/sessions/session-history-eviction.ts", "src/config/sessions/session-transcript-reconcile-custody.ts", "src/config/sessions/session-transcript-reconcile-read-kernel.ts", "src/config/sessions/session-transcript-reconcile-reader.test.ts", "src/config/sessions/session-transcript-reconcile-reader.ts", "src/config/sessions/session-transcript-reconcile-reader.worker.test.ts", "src/config/sessions/session-transcript-reconcile-readiness.ts", "src/config/sessions/session-transcript-reconcile-write-contract.ts", "src/config/sessions/session-transcript-reconcile-write-kernel.ts", "src/config/sessions/session-transcript-reconcile-writer.test.ts", "src/config/sessions/session-transcript-reconcile-writer.ts", "src/config/sessions/session-transcript-reconcile.custody-control.test.ts", "src/config/sessions/session-transcript-reconcile.dirty-peer.test-support.mjs", "src/config/sessions/session-transcript-reconcile.entry-worker.test.ts", "src/config/sessions/session-transcript-reconcile.ts", "src/config/sessions/session-transcript-worker-readers.ts", "src/config/sessions/session-transcript-worker-runtime.imports.test.ts", "src/config/sessions/session-transcript-worker-runtime.ts", "src/config/sessions/session-transcript-worker.types.ts", "src/config/sessions/session-transcript.worker.ts", "src/gateway/session-transcript-preview.ts", "src/gateway/session-transcript-title-reader.ts", "src/state/agent-deletion-cleanup.ts", "src/state/openclaw-agent-db-resources.close-wait.test.ts", "src/state/openclaw-agent-db-resources.ts", "src/state/openclaw-agent-execution-contract.ts", "src/state/openclaw-agent-execution.worker.ts"])
          actual = set(subprocess.check_output(["git", "diff", "--name-only", "c34e90e1ac1d380e06204f2182b6adb7dba59ae9", "HEAD"], text=True).splitlines())
          assert actual == expected, (sorted(actual - expected), sorted(expected - actual))
          PYVERIFY
          sha256sum --check <<'SHA256'
          b3958b1f1784086ab1ca2f0ee7506510c48bf402069ac415be870d77501a88da  src/config/sessions/session-accessor.sqlite-entry-admission-worker.test.ts
          54c5f07be4c1312677b91ac24b96b3746b90cd66831f3f64bc11a94e5689b2f2  src/config/sessions/session-accessor.sqlite-entry-admission-worker.ts
          d7c59e7696a6e864bafe049b9231778f57a97ff31c5c2beadb4429610c517319  src/config/sessions/session-accessor.sqlite-entry-admission.ts
          c6d9e66eebb52c6b970417f19d636685ac061210cd80f17083cfb8fb8a9fd841  src/config/sessions/session-accessor.sqlite-page-reclamation.ts
          7a6bfd45b5b16bd6be35181a044cd4d46f20e7a6d9ef1c97b553e1a64c6237c2  src/config/sessions/session-history-eviction.ts
          7eb4ddc5b85aa22c722d7ef15a8508535996e62762e17111edf09bbcd069a05b  src/config/sessions/session-transcript-reconcile-custody.ts
          b9f04f2ba5072bc26579b003892e101fd5df3f79fc23f687d9d2b562a12790b6  src/config/sessions/session-transcript-reconcile-read-kernel.ts
          e32e6165904c10831da93c73a07b5886482e3be04fb96215c1725e8f2bc16c44  src/config/sessions/session-transcript-reconcile-reader.test.ts
          158f14287aa1c72eebf7b7e1c45c97af803ecbd565cfbbf624a6a30f4fd1b209  src/config/sessions/session-transcript-reconcile-reader.ts
          c3d4c65cd1f0dcbdd1a4593a752ced7ebafc414e0cc7eed29f298aed839e2244  src/config/sessions/session-transcript-reconcile-reader.worker.test.ts
          18b298f18517521a761055713c9eb83a3388369b5af0a24d01aabf9dc3c08539  src/config/sessions/session-transcript-reconcile-readiness.ts
          0ea34f02d58828d47d49346b99d417d82f4beb5b6c3c6ea37f4755edb4c6bdee  src/config/sessions/session-transcript-reconcile-write-contract.ts
          2a1324ed377cb308db0a4485a86b89bfa0ce1102e7100fc905a41a4e992adac6  src/config/sessions/session-transcript-reconcile-write-kernel.ts
          282c89d774f414c18135a73c8e3111f7434d94fe92207a6aad042e2178cf8522  src/config/sessions/session-transcript-reconcile-writer.test.ts
          e279a7be4c49bdaac3dec37d77184fb0875491819c4cbea3ff9c9035ffd25f71  src/config/sessions/session-transcript-reconcile-writer.ts
          fedb7d77afdef54a6f8c7a16c1d52065657ddf718bae66c093d897653350af28  src/config/sessions/session-transcript-reconcile.custody-control.test.ts
          8c6737c3cf756b10c42075787dcb8976b1fcdf48499e03531a2701e7eb588225  src/config/sessions/session-transcript-reconcile.dirty-peer.test-support.mjs
          e6c8437dc29c26a5905f5df82d551c365ee10c489381a4806ee710346f2efdcf  src/config/sessions/session-transcript-reconcile.entry-worker.test.ts
