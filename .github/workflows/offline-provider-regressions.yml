name: Offline provider phase1 image feasibility
on:
  workflow_dispatch:
    inputs:
      scope_sha256:
        description: Exact separately approved phase1 authorization-scope.json SHA256 (direction approval is insufficient)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: offline-phase1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image-feasibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - project: bfl
            base: 30786562e236aab6a924981c62aa61b920132c76
          - project: embeddings
            base: 5a02a59bd02fbb01cefa1d49ae7714bd988dc3c4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: tooling
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.base }}
          persist-credentials: false
          path: candidate-input
          fetch-depth: 1
      - if: matrix.project == 'embeddings'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b94316f2357b998967c3cd50bb2aaf1034355ebe
          persist-credentials: false
          path: carrier-input
          fetch-depth: 1
      - name: Single bounded phase1 attempt — no products
        env:
          PROJECT: ${{ matrix.project }}
          OPENCLAW_PHASE1_OWNER_AUTHORIZED: ${{ inputs.scope_sha256 }}
        run: sudo -n --preserve-env=GITHUB_ACTIONS,GITHUB_EVENT_NAME,GITHUB_REPOSITORY,GITHUB_REF,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_ENVIRONMENT,RUNNER_OS,ImageOS,ImageVersion,OPENCLAW_PHASE1_OWNER_AUTHORIZED,PROJECT /usr/bin/python3 -I -S -B tooling/.github/offline-provider-regressions/phase1/hosted-entry.py run --project "$PROJECT" --scope-hash "$OPENCLAW_PHASE1_OWNER_AUTHORIZED" --candidate candidate-input --carrier carrier-input --tooling tooling --artifacts phase1-artifacts
      - name: Independent always-run closure finalizer — no disposal proof
        if: always()
        env:
          PROJECT: ${{ matrix.project }}
          OPENCLAW_PHASE1_OWNER_AUTHORIZED: ${{ inputs.scope_sha256 }}
        run: sudo -n --preserve-env=GITHUB_ACTIONS,GITHUB_EVENT_NAME,GITHUB_REPOSITORY,GITHUB_REF,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_ENVIRONMENT,RUNNER_OS,ImageOS,ImageVersion,OPENCLAW_PHASE1_OWNER_AUTHORIZED,PROJECT /usr/bin/python3 -I -S -B tooling/.github/offline-provider-regressions/phase1/hosted-entry.py finalize --project "$PROJECT" --scope-hash "$OPENCLAW_PHASE1_OWNER_AUTHORIZED" --artifacts phase1-artifacts
      - name: Complete bounded public receipts — standard workflow logs only
        env:
          PROJECT: ${{ matrix.project }}
        run: /usr/bin/python3 -I -S -B tooling/.github/offline-provider-regressions/phase1/receipt-logs.py --directory phase1-artifacts --project "$PROJECT"
