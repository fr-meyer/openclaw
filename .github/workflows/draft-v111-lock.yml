name: Derive 11.1 approved TypeScript beta lock

on:
  push:
    branches:
      - prep/v2026.11.1-source-qualification

permissions:
  contents: read

concurrency:
  group: derive-v111-ts-beta-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependency-admission:
    if: github.repository == 'fr-meyer/openclaw' && github.ref == 'refs/heads/prep/v2026.11.1-source-qualification'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 3

      - name: Verify draft source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = fff7df87e092ae984b8d41acb17489f6dfc0edf2
          test "$(git rev-parse HEAD^^)" = 0836b97eb5fc67691198783256b8de672d14c83e
          test "$(git rev-parse HEAD:pnpm-lock.yaml)" = 815ecaa51d26e8a6bf49b4e8ba1ed07e0694dae1
          test "$(git rev-parse HEAD:scripts/check-dependency-pins.mts)" = 12d1fe1d3d78b214d292adcb78e96f2c9202bdac
          test "$(git rev-parse HEAD:scripts/generate-npm-package-lock.mts)" = 733f1c9411fd6163e25721edcc628f2ceb540dbe
          test "$(git rev-parse HEAD:scripts/lib/peer-override-policy.mts)" = f37d11ba55e3c6d190c6be4a836f449216c5a658
          test "$(git rev-parse HEAD:test/scripts/check-dependency-pins.test.ts)" = 3899206d15f874cd7b114e3661c60abdb064660b
          test "$(git rev-parse HEAD:test/scripts/generate-npm-package-lock-peers.test.ts)" = 9da098e88490b33862c6d57749b7bd74fb24c756
          test "$(git rev-parse HEAD:test/scripts/generate-npm-package-lock.test.ts)" = 4c6e53ed7e57e729b0595e86a07750b1ac58f20a
          test "$(git rev-parse HEAD:src/agents/embedded-agent-subscribe.subscribe-embedded-agent-session.final-answer-delivery.test.ts)" = 2cb533e9a962f75877622fc0d14b4afb3b3a1da3
          test "$(git rev-parse HEAD:src/agents/agent-harness-completion-delivery.test.ts)" = 1128e6e6b6413144934ac2302f35dacc4dc4e735
          test "$(git rev-parse HEAD:pnpm-workspace.yaml)" = 91ac3d364b4ac945d2f61c3209ac823b68564c84
          test "$(git rev-parse HEAD:package.json)" = e36ac3764d7fc27bcbd01bb7833453d679f2b470
          test "$(git rev-parse HEAD:extensions/memory-lancedb/package.json)" = 20b4bf7adff1876b19d7f480fd7d7c0c3e68fb68
          test "$(git rev-parse HEAD:custom-patches/manifest.json)" = e865cb2ab05ac65620106235d58a0abba0357609
          test "$(git rev-parse HEAD:custom-patches/reconciliation-2026.11.1.json)" = 25030de4cb9809ce44414705cec66fcece5aa710
          test "$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)" = f112c6c044975f5cd0b66bc3545337e4997c70bddfee5b1bbbb15ca7ef1ae63c
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const memory = JSON.parse(fs.readFileSync('extensions/memory-lancedb/package.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('custom-patches/manifest.json', 'utf8'));
          if (pkg.version !== '2026.11.1' ||
              pkg.devDependencies.tsdown !== '0.23.2' ||
              pkg.devDependencies.typescript !== '7.1.0-beta' ||
              memory.devDependencies['@lancedb/lancedb'] !== '0.41.0' ||
              Object.entries(memory.optionalDependencies)
                .filter(([name]) => name.startsWith('@lancedb/lancedb-')).length !== 7 ||
              Object.entries(memory.optionalDependencies)
                .filter(([name]) => name.startsWith('@lancedb/lancedb-'))
                .some(([, version]) => version !== '0.41.0') ||
              manifest.status !== 'LOCAL_INTEGRATION_DRAFT_UNQUALIFIED' ||
              manifest.productionEligible !== false ||
              manifest.integrationBasis?.combinedLock !==
                'PENDING_APPROVED_TS_BETA_CI_REDERIVATION') {
            throw new Error('Expected unqualified 11.1 source candidate');
          }
          NODE

      - name: Setup pinned Node and pnpm without install or cache
        uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.22.1'
          install-bun: 'false'
          install-deps: 'false'
          cache-mode: off

      - name: Derive approved TypeScript beta lock under strict age policy
        shell: bash
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          test "$(pnpm -v)" = '12.15.0'
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          grep -q '^  typescript@7.1.0-beta:' pnpm-lock.yaml
          grep -q "^  '@smithy/core@3.38.1':" pnpm-lock.yaml
          ! grep -q "^  '@smithy/core@3.35.1':" pnpm-lock.yaml
          grep -q '^  rolldown-plugin-dts@0.29.0:' pnpm-lock.yaml
          grep -q '^  tsdown@0.23.2:' pnpm-lock.yaml
          grep -q "^  '@lancedb/lancedb@0.41.0':" pnpm-lock.yaml
          git diff --check -- pnpm-lock.yaml
          sha256sum pnpm-lock.yaml
          git diff --numstat -- pnpm-lock.yaml
          echo 'BEGIN_DRAFT_V111_TS_BETA_LOCK_GZIP_BASE64'
          gzip -n -c pnpm-lock.yaml | base64 -w 76
          echo 'END_DRAFT_V111_TS_BETA_LOCK_GZIP_BASE64'
