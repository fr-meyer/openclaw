name: Qualify 11.1 synthetic migration and rollback

on:
  push:
    branches:
      - prep/v2026.11.1-migration-source-qualification

permissions:
  contents: read

concurrency:
  group: qualify-v111-migration-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migration-source:
    if: github.repository == 'fr-meyer/openclaw' && github.ref == 'refs/heads/prep/v2026.11.1-migration-source-qualification'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Verify unchanged 11.1 source and unqualified status
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = b07b2a03fad23cf530d1bb72f56e487744702fa3
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/draft-v111-lock.yml
          test "$(git rev-parse HEAD:pnpm-lock.yaml)" = 9a8fad5519c62064cd3e9b8960d5225ce207f895
          test "$(git rev-parse HEAD:custom-patches/manifest.json)" = 91c3232e601f96d2dc5bf346065a6650f1766d09
          test "$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)" = 41e318361b737665c117d3d9c16f71c6a583c9a7e60cbdf0455dc541b0c28a7f
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('custom-patches/manifest.json', 'utf8'));
          if (pkg.version !== '2026.11.1' ||
              manifest.status !== 'LOCAL_INTEGRATION_DRAFT_UNQUALIFIED' ||
              manifest.productionEligible !== false) {
            throw new Error('11.1 source identity or admission status changed');
          }
          NODE

      - name: Setup pinned Node and pnpm without cache
        uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.22.1'
          install-bun: 'false'
          install-deps: 'false'
          cache-mode: off

      - name: Frozen install without scripts
        shell: bash
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          test "$(pnpm -v)" = '12.15.0'
          pnpm install --frozen-lockfile --ignore-scripts
          test "$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)" = 41e318361b737665c117d3d9c16f71c6a583c9a7e60cbdf0455dc541b0c28a7f

      - name: Test frozen predecessor state and Doctor backup
        shell: bash
        env:
          CI: 'true'
          TMPDIR: ${{ runner.temp }}/openclaw-v111-migration-tmp
          OPENCLAW_STATE_DIR: ${{ runner.temp }}/openclaw-v111-migration-state
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR" "$OPENCLAW_STATE_DIR"
          pnpm test src/state/openclaw-state-h3-v20-upgrade.test.ts src/state/openclaw-agent-db-session-migrations.test.ts src/commands/doctor-migration-backup.test.ts --maxWorkers=1

      - name: Test backup restore and updater database rollback
        shell: bash
        env:
          CI: 'true'
          TMPDIR: ${{ runner.temp }}/openclaw-v111-migration-tmp
          OPENCLAW_STATE_DIR: ${{ runner.temp }}/openclaw-v111-migration-state
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR" "$OPENCLAW_STATE_DIR"
          pnpm test src/commands/backup-restore.test.ts src/cli/update-cli/update-command-database-rollback.test.ts --maxWorkers=1
