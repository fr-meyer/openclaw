name: Qualify 11.1 TypeScript beta filesystem adapter

on:
  push:
    branches:
      - prep/v2026.11.1-source-qualification

permissions:
  contents: read

concurrency:
  group: qualify-v111-smithy-peer-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependency-admission:
    if: github.repository == 'fr-meyer/openclaw' && github.ref == 'refs/heads/prep/v2026.11.1-source-qualification'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 3

      - name: Verify draft source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 531e1599dcab50df282cc1f630ce5e39849d76c3
          test "$(git rev-parse HEAD^^)" = 5067960d6c2386751bfda7113f7d48201beb8ca4
          if git grep -n -F "typescript/unstable/" -- scripts src test packages extensions; then
            echo "Obsolete TypeScript unstable import remains" >&2
            exit 1
          else
            grep_status=$?
            if (( grep_status != 1 )); then
              exit "$grep_status"
            fi
          fi
          test "$(git rev-parse HEAD:scripts/lib/native-typescript.mts)" = ccd6d873a2c4afdca109eb5931a5fbde47838b5f
          test "$(git rev-parse HEAD:test/scripts/native-typescript.test.ts)" = 4abb28603af08cbea222b2901413bbb9d865d118
          test "$(git rev-parse HEAD:pnpm-lock.yaml)" = 9a8fad5519c62064cd3e9b8960d5225ce207f895
          test "$(git rev-parse HEAD:scripts/check-dependency-pins.mts)" = 12d1fe1d3d78b214d292adcb78e96f2c9202bdac
          test "$(git rev-parse HEAD:scripts/generate-npm-package-lock.mts)" = 733f1c9411fd6163e25721edcc628f2ceb540dbe
          test "$(git rev-parse HEAD:scripts/lib/peer-override-policy.mts)" = f37d11ba55e3c6d190c6be4a836f449216c5a658
          test "$(git rev-parse HEAD:test/scripts/check-dependency-pins.test.ts)" = 3899206d15f874cd7b114e3661c60abdb064660b
          test "$(git rev-parse HEAD:test/scripts/generate-npm-package-lock-peers.test.ts)" = 9da098e88490b33862c6d57749b7bd74fb24c756
          test "$(git rev-parse HEAD:test/scripts/generate-npm-package-lock.test.ts)" = 4c6e53ed7e57e729b0595e86a07750b1ac58f20a
          test "$(git rev-parse HEAD:src/agents/embedded-agent-subscribe.subscribe-embedded-agent-session.final-answer-delivery.test.ts)" = 2cb533e9a962f75877622fc0d14b4afb3b3a1da3
          test "$(git rev-parse HEAD:src/agents/agent-harness-completion-delivery.test.ts)" = 1128e6e6b6413144934ac2302f35dacc4dc4e735
          test "$(git rev-parse HEAD:pnpm-workspace.yaml)" = 91ac3d364b4ac945d2f61c3209ac823b68564c84
          test "$(git rev-parse HEAD:package.json)" = e36ac3764d7fc27bcbd01bb7833453d679f2b470
          test "$(git rev-parse HEAD:extensions/memory-lancedb/package.json)" = 20b4bf7adff1876b19d7f480fd7d7c0c3e68fb68
          test "$(git rev-parse HEAD:custom-patches/manifest.json)" = 91c3232e601f96d2dc5bf346065a6650f1766d09
          test "$(git rev-parse HEAD:custom-patches/reconciliation-2026.11.1.json)" = dccaaadbe9e634fd1f129a55f3576fa6cae44649
          test "$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)" = 41e318361b737665c117d3d9c16f71c6a583c9a7e60cbdf0455dc541b0c28a7f
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const memory = JSON.parse(fs.readFileSync('extensions/memory-lancedb/package.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('custom-patches/manifest.json', 'utf8'));
          if (pkg.version !== '2026.11.1' ||
              pkg.devDependencies.tsdown !== '0.23.2' ||
              pkg.devDependencies.typescript !== '7.1.0-beta' ||
              memory.devDependencies['@lancedb/lancedb'] !== '0.41.0' ||
              Object.entries(memory.optionalDependencies)
                .filter(([name]) => name.startsWith('@lancedb/lancedb-')).length !== 7 ||
              Object.entries(memory.optionalDependencies)
                .filter(([name]) => name.startsWith('@lancedb/lancedb-'))
                .some(([, version]) => version !== '0.41.0') ||
              manifest.status !== 'LOCAL_INTEGRATION_DRAFT_UNQUALIFIED' ||
              manifest.productionEligible !== false ||
              manifest.integrationBasis?.combinedLock !==
                'REVIEWED_TS_BETA_LOCK_FROZEN_PENDING_UNQUALIFIED') {
            throw new Error('Expected unqualified 11.1 source candidate');
          }
          NODE

      - name: Setup pinned Node and pnpm without install or cache
        uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.22.1'
          install-bun: 'false'
          install-deps: 'false'
          cache-mode: off

      - name: Frozen dependency admission without install scripts
        shell: bash
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          test "$(pnpm -v)" = '12.15.0'
          pnpm install --frozen-lockfile --ignore-scripts
          test "$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)" = 41e318361b737665c117d3d9c16f71c6a583c9a7e60cbdf0455dc541b0c28a7f
          grep -q "^  '@smithy/core@3.38.1':" pnpm-lock.yaml
          ! grep -q "^  '@smithy/core@3.35.1':" pnpm-lock.yaml
          grep -q '^  rolldown-plugin-dts@0.29.0:' pnpm-lock.yaml
          grep -q '^  tsdown@0.23.2:' pnpm-lock.yaml
          grep -q '^  typescript@7.1.0-beta:' pnpm-lock.yaml
          grep -q "^  '@lancedb/lancedb@0.41.0':" pnpm-lock.yaml

      - name: Diagnose ACP SDK npm mirror placement
        shell: bash
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          node --import ./scripts/tsx.mjs --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import path from 'node:path';
          import {
            packageJsonForNpmLock,
            readNpmLockOverrides,
          } from './scripts/generate-npm-package-lock.mts';
          const packageDir = path.resolve('extensions/acpx');
          const pkg = JSON.parse(readFileSync(path.join(packageDir, 'package.json'), 'utf8'));
          const planned = readNpmLockOverrides(pkg, packageDir);
          const effective = packageJsonForNpmLock(pkg, planned).overrides;
          const parentKeys = new Set([
            '@agentclientprotocol/codex-acp',
            '@agentclientprotocol/codex-acp@2.1.1',
            'acpx',
            'acpx@0.19.4',
            '@agentclientprotocol/claude-agent-acp',
            '@agentclientprotocol/claude-agent-acp@0.95.0',
          ]);
          const project = (overrides) => Object.fromEntries(
            Object.entries(overrides ?? {}).flatMap(([key, value]) => {
              if (key === '@agentclientprotocol/sdk' || key.startsWith('@agentclientprotocol/sdk@')) {
                return [[key, typeof value === 'string' ? value : value?.['.']]];
              }
              if (!parentKeys.has(key) || !value || typeof value !== 'object') return [];
              return [[key, Object.fromEntries(Object.entries(value)
                .filter(([child]) => child === '.' || child === '@agentclientprotocol/sdk')
                .map(([child, spec]) => [child, typeof spec === 'string' ? spec : spec?.['.']]))]];
            }),
          );
          console.log('planned-sdk-overrides=' + JSON.stringify(project(planned)));
          console.log('effective-sdk-overrides=' + JSON.stringify(project(effective)));
          NODE
          node scripts/generate-npm-package-lock.mjs --package-dir extensions/acpx

      - name: Test TypeScript beta adapter and peer override guards
        shell: bash
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          pnpm test test/scripts/native-typescript.test.ts test/scripts/check-dependency-pins.test.ts test/scripts/generate-npm-package-lock-peers.test.ts test/scripts/generate-npm-package-lock.test.ts --maxWorkers=1

      - name: Check peers, patches, pins and npm mirrors independently
        shell: bash
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          peer=0; patches=0; pins=0; mirrors=0
          pnpm peers check || peer=$?
          pnpm deps:patches:check || patches=$?
          pnpm deps:pins:check || pins=$?
          pnpm deps:npm-lock:check || mirrors=$?
          echo "RESULT peers=$peer patches=$patches pins=$pins npm_mirrors=$mirrors"
          if (( peer || patches || pins || mirrors )); then
            exit 1
          fi

      - name: Build package and declarations on GitHub
        shell: bash
        env:
          CI: 'true'
          OPENCLAW_BUILD_CACHE: '0'
        run: |
          set -euo pipefail
          pnpm build

      - name: Test tsdown wrapper on GitHub
        shell: bash
        env:
          CI: 'true'
          TMPDIR: ${{ runner.temp }}/openclaw-v111-tmp
          OPENCLAW_STATE_DIR: ${{ runner.temp }}/openclaw-v111-state
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR" "$OPENCLAW_STATE_DIR"
          pnpm test test/scripts/tsdown-build.test.ts --maxWorkers=1
